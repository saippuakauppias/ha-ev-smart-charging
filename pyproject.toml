[project]
name = "ha-ev-smart-charging"
version = "1.0.0"
description = "Home Assistant blueprint for adaptive overnight EV charging"
requires-python = ">=3.11"

[tool.pytest.ini_options]
minversion = "7.0"
testpaths = ["tests"]
pythonpath = ["tests"]
addopts = "-ra --strict-markers --strict-config"
markers = [
    "slow: mutation testing; runs the whole suite once per mutation",
]
filterwarnings = ["error"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B", "SIM"]
