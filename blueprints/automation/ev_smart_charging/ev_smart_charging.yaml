blueprint:
  name: "EV — умная ночная зарядка (растяжка тока на окно)"
  description: >
    Управляет зарядной станцией электромобиля или PHEV в заданном окне и **динамически
    подбирает ток**, чтобы зарядка равномерно растянулась до времени окончания,
    а не «выстреливала» максимумом в первый час и потом стояла.


    Зачем это нужно: меньший ток — меньше нагрев кабеля и бортового зарядного
    устройства, мягче режим для батареи и ровнее нагрузка на домашнюю сеть.
    При этом машина всё равно готова к нужному времени.


    Ничего не зашито жёстко — все сущности выбираются в интерфейсе. Blueprint
    не привязан к конкретной марке автомобиля или модели зарядной станции.


    **Два независимых способа посчитать, сколько ещё нужно залить:**

    1. по проценту заряда батареи — (цель % − текущий %) × ёмкость;

    2. по энергии сессии — целевые кВт·ч минус уже отданные счётчиком станции.
       Работает вообще без связи с машиной.

    Если доступны оба — приоритет у процента заряда. Если ни одного — резервный ток
    до конца окна.


    **Отказоустойчивость.** Данные о заряде проверяются по трём признакам, строго
    в этом порядке:

    1. *сущность недоступна* (`unavailable` / `unknown`) — самый частый случай,
       обычно означает, что у интеграции автомобиля слетела авторизация и её нужно
       переподключить; проверяется в первую очередь;

    2. *данные устарели* — по сенсору времени с последнего выхода машины на связь;

    3. *данные «замёрзли»* — процент не меняется, хотя станция реально отдаёт ток.
       Нужно потому, что многие облачные интеграции при пропаже связи с машиной
       не уходят в `unavailable`, а продолжают отдавать последнее закэшированное
       значение сколь угодно долго.

    При любом из трёх автоматизация не падает: план переключается на энергию сессии
    либо на резервный ток, зарядка продолжается, а в хук ошибки уходит причина.


    **Троттлинг.** Между любыми двумя командами станции выдерживается пауза,
    и повторная запись тока невозможна раньше, чем через заданный интервал после
    предыдущего изменения. Многие станции плохо переносят частые команды.


    Версия 1.3.0

  domain: automation
  source_url: https://raw.githubusercontent.com/saippuakauppias/ha-ev-smart-charging/refs/heads/main/blueprints/automation/ev_smart_charging/ev_smart_charging.yaml
  homeassistant:
    min_version: "2024.10.0"

  input:
    section_charger:
      name: "⚡ Зарядная станция"
      icon: mdi:ev-station
      collapsed: false
      input:
        charger_switch:
          name: "Выключатель зарядки"
          description: >
            Сущность `switch`, которая разрешает или запрещает выдачу тока.
            Если у станции несколько переключателей — нужен тот, что включает
            саму зарядку, а не подсветку, звук или блокировку кабеля.
          selector:
            entity:
              filter:
                - domain: switch

        charger_current_number:
          name: "Уставка тока"
          description: >
            Сущность `number`, задающая ток зарядки в амперах. В интерфейсе выглядит
            как ползунок или поле ввода со значением вроде 16 и единицами «A».
          selector:
            entity:
              filter:
                - domain: number

        charger_status_sensor:
          name: "Сенсор статуса станции"
          description: >
            Текстовый сенсор, показывающий, чем станция занята прямо сейчас.
            Как найти: **Инструменты разработчика → Состояния**, отфильтруйте по имени
            станции и ищите сенсор, значение которого — слово, а не число:
            `available`, `plugged_in`, `charging`, `charged`, `fault` и подобные.
            Ниже, в разделе «Расшифровка статусов», эти слова нужно будет перечислить.


            Не подойдут сенсоры с числами (ток, мощность, энергия, напряжение) —
            для них есть отдельные поля.
          selector:
            entity:
              filter:
                - domain: sensor

        charger_power_sensor:
          name: "Сенсор мощности станции, Вт (опционально)"
          description: >
            Нужен для двух вещей: watchdog «включено, но ток не идёт» и определение
            факта зарядки для детектора замёрзших данных. Если сенсора нет,
            оба механизма переключатся на статус станции — чуть менее надёжно,
            но работоспособно.
          default: []
          selector:
            entity:
              filter:
                - domain: sensor
                  device_class: power

        charger_current_sensor:
          name: "Сенсор фактического тока, А (опционально)"
          description: >
            Ток, который станция реально отдаёт прямо сейчас. Не путайте с уставкой
            тока выше: уставка — это то, что мы просим, а этот сенсор — то, что
            получилось на самом деле. Значения обычно немного расходятся.


            Используется для вычисления реального напряжения под нагрузкой
            и для записи в журнал. На выбор уставки напрямую не влияет.
          default: []
          selector:
            entity:
              filter:
                - domain: sensor
                  device_class: current

        charger_voltage_sensor:
          name: "Сенсор напряжения (опционально)"
          description: >
            Живое напряжение фазы. Если задан и показывает больше 175 В — используется
            в расчёте вместо номинального. Порог 175 В выбран потому, что ниже этого
            значения зарядка в любом случае должна отключаться по недопустимому
            напряжению, поэтому такие показания означают либо простой станции,
            либо неисправность, и в расчёт их брать нельзя.
          default: []
          selector:
            entity:
              filter:
                - domain: sensor
                  device_class: voltage

        session_energy_sensor:
          name: "Сенсор энергии текущей сессии, кВт·ч (опционально)"
          description: >
            Счётчик энергии, который обнуляется в начале каждой новой зарядки
            (у станций часто называется «Last charge» или «Текущая сессия»).
            Не путайте с общим накопительным счётчиком за всё время — тот не подойдёт.
            Используется как запасной способ планирования, если процент заряда
            машины недоступен.
          default: []
          selector:
            entity:
              filter:
                - domain: sensor
                  device_class: energy

        charger_link_sensor:
          name: "Сенсор доступности станции (опционально)"
          description: >
            Бинарный сенсор с классом «подключение», который показывает, отвечает ли
            сама станция. У локальных интеграций обычно называется «Связь», «Онлайн»
            или «Соединение» и имеет значения «Подключено / Отключено».


            Пока он выключен, автоматизация не пытается слать команды в пустоту.
            Речь именно о связи Home Assistant со станцией, а не станции с автомобилем.
            Если такого сенсора у станции нет — оставьте поле пустым, автоматизация
            будет считать станцию доступной всегда.
          default: []
          selector:
            entity:
              filter:
                - domain: binary_sensor
                  device_class: connectivity

        charger_problem_sensor:
          name: "Сенсор неисправности станции (опционально)"
          description: >
            Бинарный сенсор с классом «проблема». Если включён — зарядка
            останавливается и срабатывает хук ошибки.
          default: []
          selector:
            entity:
              filter:
                - domain: binary_sensor
                  device_class: problem

        charger_mode_select:
          name: "Выбор режима зарядки (опционально)"
          description: >
            Если у станции есть собственные режимы (немедленная зарядка, зарядка
            до процента, по внутреннему расписанию) — укажите эту сущность.
            Перед стартом режим будет принудительно выставлен в ручной, иначе
            встроенный планировщик станции перебьёт наши команды и вы получите
            конфликт двух расписаний.
          default: []
          selector:
            entity:
              filter:
                - domain: select

        charger_mode_value:
          name: "Значение режима для ручного управления"
          description: >
            Точное значение из списка выше, соответствующее немедленной зарядке
            без внутреннего расписания станции.
          default: immediate
          selector:
            text:

    section_status_map:
      name: "🔤 Расшифровка статусов станции"
      icon: mdi:format-list-bulleted
      collapsed: true
      input:
        status_unplugged:
          name: "Статусы «кабель не подключён»"
          description: >
            Через запятую. При таком статусе зарядка не стартует.
            Посмотреть возможные значения можно в истории сенсора статуса.
          default: "available, fault_unplugged"
          selector:
            text:

        status_charging:
          name: "Статусы «идёт зарядка»"
          description: "Запасной признак работы, если сенсор мощности не задан."
          default: "charging"
          selector:
            text:

        status_done:
          name: "Статусы «заряд завершён»"
          description: "При таком статусе автоматизация считает задачу выполненной."
          default: "charged"
          selector:
            text:

        status_fault:
          name: "Статусы «неисправность»"
          default: "fault"
          selector:
            text:

    section_car:
      name: "🚗 Автомобиль"
      icon: mdi:car-electric
      collapsed: false
      input:
        car_battery_sensor:
          name: "Сенсор процента заряда батареи, % (опционально)"
          description: >
            **Внимание: это процент заряда (SoC), а не здоровье батареи (SOH).**
            Это две разные сущности, которые легко перепутать — обе в процентах.


            Нужный сенсор показывает, насколько батарея заряжена прямо сейчас:
            значение меняется в процессе зарядки и поездки, обычно от 10 до 100.
            Сенсор здоровья батареи почти не меняется, обновляется раз в несколько
            часов и у новой батареи может показывать больше 100 % — он задаётся
            отдельным полем ниже и для расчёта заряда не годится.


            Проверьте в **Инструментах разработчика → Состояния**, что значение
            действительно растёт во время зарядки.
          default: []
          selector:
            entity:
              filter:
                - domain: sensor
                  device_class: battery

        car_stale_sensor:
          name: "Сенсор времени с последнего выхода машины на связь, сек — рекомендуется"
          description: >
            Показывает, сколько секунд назад автомобиль последний раз связывался
            с сервером (в интеграциях называется «Последний пинг», `last_ping`).
            Без него отличить свежие данные от закэшированных гораздо труднее:
            сенсор процента заряда при пропаже связи часто остаётся «доступным»
            и продолжает отдавать старое значение.
          default: []
          selector:
            entity:
              filter:
                - domain: sensor
                  device_class: duration

        car_stale_max:
          name: "Порог устаревания данных, сек"
          description: >
            Если машина не выходила на связь дольше этого времени, процент заряда
            считается недостоверным.
          default: 1800
          selector:
            number:
              min: 60
              max: 86400
              step: 60
              unit_of_measurement: с
              mode: box

        soc_freeze_minutes:
          name: "Детектор «замёрзшего» процента заряда, мин (0 — выкл)"
          description: >
            Третий, независимый контроль достоверности — работает даже когда сенсор
            выше не задан. Если станция реально отдаёт мощность, а процент заряда
            не менялся дольше этого времени, значит данные протухли.


            Ориентир для порога: на 6 А (примерно 1.3 кВт) один процент батареи
            на 43 кВт·ч набирается около 20 минут, на 16 А — около 8. Ставьте
            с большим запасом, чтобы не ловить ложные срабатывания.
          default: 90
          selector:
            number:
              min: 0
              max: 480
              step: 10
              unit_of_measurement: мин
              mode: box

        soh_sensor:
          name: "Сенсор здоровья батареи (SOH), % — опционально"
          description: >
            Необязательно, по умолчанию пусто — так и оставьте, если сомневаетесь.


            Здоровье батареи показывает, сколько ёмкости осталось относительно
            заводской. Если задать, полезная ёмкость будет считаться как
            «ёмкость × SOH / 100» (значение зажимается в диапазон 50–130 %,
            чтобы явно ошибочные данные не сломали расчёт). На свежей батарее
            поправка составляет пару процентов и всё равно съедается обратной
            связью регулятора; смысл появляется через несколько лет эксплуатации.


            **Не перепутайте с сенсором процента заряда** — они оба измеряются
            в процентах и часто стоят рядом в списке. SOH почти не меняется
            день ото дня, заряд меняется постоянно.
          default: []
          selector:
            entity:
              filter:
                - domain: sensor

        car_charging_binary:
          name: "Бинарный сенсор «машина заряжается» (опционально)"
          description: >
            Сенсор с классом «зарядка батареи» со стороны автомобиля.
            Используется только для диагностики: позволяет в уведомлении отличить
            «станция не отдаёт ток» от «машина отказалась брать ток».
            На управление не влияет.
          default: []
          selector:
            entity:
              filter:
                - domain: binary_sensor
                  device_class: battery_charging

        car_tracker:
          name: "Трекер местоположения машины (опционально)"
          description: >
            Сущность `device_tracker` автомобиля. Нужна, чтобы станция не начала
            заряжать чужую машину, подключённую к вашему разъёму.
          default: []
          selector:
            entity:
              filter:
                - domain: device_tracker

        home_zone:
          name: "Зона, в которой разрешена зарядка"
          description: >
            Обычно домашняя зона. Home Assistant сам определяет попадание в неё
            по координатам трекера.
          default: zone.home
          selector:
            entity:
              filter:
                - domain: zone

        require_home:
          name: "Заряжать только когда машина в зоне"
          description: >
            Автоматизация следит за трекером постоянно: если в момент начала окна
            машина ещё не приехала или GPS временно сбоил и показывал неверную
            позицию — зарядка стартует сразу, как только машина окажется в зоне,
            не дожидаясь следующей ночи.


            Уже идущая сессия при потере геолокации не прерывается: это отличает
            «трекер замолчал» от «машина уехала».
          default: true
          selector:
            boolean:

        battery_capacity:
          name: "Полезная ёмкость батареи, кВт·ч"
          description: >
            Паспортная ёмкость тяговой батареи. Смотрите в характеристиках вашей
            версии автомобиля. Точность не критична — регулятор самокорректируется
            на каждом пересчёте, ошибка в пару киловатт-часов просто сместит
            первый расчёт.
          default: 43
          selector:
            number:
              min: 1
              max: 200
              step: 0.01
              unit_of_measurement: kWh
              mode: box

    section_target:
      name: "🎯 Цель зарядки"
      icon: mdi:target
      collapsed: false
      input:
        target_soc:
          name: "Целевой заряд, %"
          description: >
            До какого процента заряжать. Работает только если задан сенсор процента
            заряда батареи. Для ежедневных поездок многие производители рекомендуют
            80–90 %, до 100 % имеет смысл заряжать перед дальней дорогой.
          default: 100
          selector:
            number:
              min: 10
              max: 100
              step: 1
              unit_of_measurement: "%"
              mode: slider

        session_energy_target:
          name: "Целевая энергия сессии, кВт·ч (0 — выключено)"
          description: >
            Запасной план на случай, когда процент заряда недоступен: заряжать,
            пока счётчик станции не отдаст столько киловатт-часов.
            Ориентир: нужные вам проценты × ёмкость / 100, плюс примерно 14 % на потери (при КПД 88 %).
          default: 0
          selector:
            number:
              min: 0
              max: 200
              step: 0.5
              unit_of_measurement: kWh
              mode: box

    section_schedule:
      name: "🕒 Окно зарядки"
      icon: mdi:clock-outline
      collapsed: false
      input:
        start_time:
          name: "Время старта"
          description: >
            Начало окна, внутри которого разрешена зарядка.


            Если у вас двухтарифный или трёхзонный счётчик, окно имеет смысл
            совместить с ночной зоной — разница в цене киловатт-часа обычно
            двукратная, а зарядка это самый крупный потребитель в доме.
            **Точное время начала и окончания ночной зоны уточните у своей
            энергосбытовой организации**: оно различается по регионам, зависит
            от модели счётчика и может меняться при переходе на сезонное время.
            Не полагайтесь на распространённое «23:00–07:00» без проверки.


            Небольшой запас после начала льготной зоны не помешает: часы счётчика
            и Home Assistant могут расходиться на несколько минут.
          default: "23:00:00"
          selector:
            time:

        stop_time:
          name: "Время окончания"
          description: >
            Конец окна. Может приходиться на следующие сутки — переход через
            полночь обрабатывается корректно.
          default: "07:00:00"
          selector:
            time:

        weekdays:
          name: "Дни недели"
          description: >
            Учитывается день, в который окно начинается: ночь с пятницы
            на субботу считается пятницей.
          default: [mon, tue, wed, thu, fri, sat, sun]
          selector:
            select:
              multiple: true
              options:
                - {label: Понедельник, value: mon}
                - {label: Вторник, value: tue}
                - {label: Среда, value: wed}
                - {label: Четверг, value: thu}
                - {label: Пятница, value: fri}
                - {label: Суббота, value: sat}
                - {label: Воскресенье, value: sun}

        time_reserve_minutes:
          name: "Резерв времени, мин"
          description: >
            План строится так, чтобы закончить на столько минут раньше конца окна.
            Компенсирует замедление заряда на последних процентах и задержки
            облачных сервисов. Если окно совпадает с льготным тарифом, резерв
            заодно страхует от заезда в дорогую зону.
          default: 30
          selector:
            number:
              min: 0
              max: 180
              step: 5
              unit_of_measurement: мин
              mode: slider

        recalc_interval:
          name: "Период пересчёта тока"
          description: >
            Как часто сверять факт с планом и корректировать ток. Чаще — точнее
            отслеживание, но больше команд станции.
          default: "/30"
          selector:
            select:
              options:
                - {label: "каждые 10 минут", value: "/10"}
                - {label: "каждые 15 минут", value: "/15"}
                - {label: "каждые 20 минут", value: "/20"}
                - {label: "каждые 30 минут", value: "/30"}

    section_power:
      name: "🔌 Ток и электрика"
      icon: mdi:flash
      collapsed: false
      input:
        min_current:
          name: "Минимальный ток, А"
          description: >
            Жёсткая нижняя граница — ниже автоматизация не выставит никогда,
            даже если по расчёту можно было бы заряжать медленнее.
            Слишком малый ток некоторые машины просто не принимают;
            стандарт для однофазной зарядки начинается с 6 А.
          default: 6
          selector:
            number:
              min: 1
              max: 80
              step: 1
              unit_of_measurement: A
              mode: box

        max_current:
          name: "Максимальный ток, А"
          description: >
            Жёсткая верхняя граница — выше автоматизация не выставит никогда.
            Ориентируйтесь на самое слабое звено всей цепи: номинал автомата,
            сечение кабеля до станции, возможности самой станции и бортового
            зарядного устройства машины. Длительная нагрузка должна быть заметно
            ниже номинала защитного автомата.
          default: 28
          selector:
            number:
              min: 1
              max: 80
              step: 1
              unit_of_measurement: A
              mode: box

        current_step:
          name: "Дискретность тока, А"
          description: >
            С каким шагом станция принимает значения тока. Расчётное значение
            округляется вверх до кратного этому числу.
          default: 1
          selector:
            number:
              min: 1
              max: 5
              step: 1
              unit_of_measurement: A
              mode: box

        fallback_current:
          name: "Резервный ток, А"
          description: >
            Используется, когда посчитать план нечем: и процент заряда, и энергия
            сессии недоступны. Выберите умеренное значение, при котором ночи
            обычно хватает для полной зарядки.
          default: 10
          selector:
            number:
              min: 1
              max: 80
              step: 1
              unit_of_measurement: A
              mode: box

        nominal_voltage:
          name: "Запасное напряжение сети, В"
          description: >
            **Используется только тогда, когда реальное напряжение измерить нечем.**
            Приоритет источников такой:


            1. сенсор напряжения станции, если он показывает больше 175 В;

            2. вычисление из мощности и фактического тока (мощность / ток / число фаз),
               если заданы оба сенсора и зарядка идёт;

            3. и только если ни то ни другое не доступно — это поле.


            Зачем оно нужно вообще: в момент, когда автоматизация решает начать
            зарядку, станция ещё обесточена и сенсор напряжения показывает ноль —
            измерять пока нечего, а ток для первой команды посчитать уже надо.
            Дальше, со второго пересчёта, в дело идут живые данные и это значение
            больше не участвует.


            Поэтому точность здесь некритична: ошибка повлияет только на первую
            уставку тока в сессии и будет исправлена при следующем пересчёте.
            Всё же лучше поставить своё типичное напряжение, а не паспортные 230 В —
            тогда и первый расчёт будет близок к истине.


            На запуск и остановку зарядки не влияет никак. Защита от недопустимого
            напряжения — задача реле напряжения в щите, а не автоматизации.
          default: 230
          selector:
            number:
              min: 100
              max: 260
              step: 1
              unit_of_measurement: V
              mode: box

        phases:
          name: "Число фаз"
          description: "Сколько фаз реально задействовано в зарядке."
          default: "1"
          selector:
            select:
              options:
                - {label: "1 фаза", value: "1"}
                - {label: "3 фазы", value: "3"}

        efficiency:
          name: "КПД зарядки, %"
          description: >
            Доля энергии из розетки, которая реально доходит до батареи. Остальное
            уходит в нагрев кабеля, бортового зарядного устройства и самой батареи.
            Зимой обычно 80–85 %, летом 90–93 %. Занижать безопаснее: ток получится
            чуть выше плана и машина точно успеет.
          default: 88
          selector:
            number:
              min: 60
              max: 100
              step: 1
              unit_of_measurement: "%"
              mode: slider

        current_deadband:
          name: "Минимальное изменение тока для записи, А"
          description: >
            Насколько новое расчётное значение должно отличаться от **текущей уставки**,
            чтобы автоматизация стала переписывать её на станции.


            **Действует только при снижении тока.** Просьба поднять ток означает,
            что по расчёту мы не укладываемся в окно, и заглушить её значило бы
            сознательно не долить — вверх уставка пишется при отличии хотя бы
            в один шаг станции. Снижение такой срочности не имеет: лишний ампер
            не мешает дойти до цели, а перезапись ради долей ампера изнашивает
            станцию, — вот здесь параметр и работает.


            Важно: сравнивается уставка с уставкой. Фактический ток, который станция
            показывает в своих сенсорах, в этом сравнении не участвует вообще.
            Расхождение вида «просим 20 А, идёт 18.3 А» — это нормально: недобор
            компенсируется обратной связью по проценту заряда, а подмешивание
            фактического тока дало бы дребезг на ровном месте.


            Исключение: если расчёт требует ровно максимума или ровно минимума,
            уставка записывается независимо от этого параметра. Иначе при большом
            значении ток мог бы застрять в паре ампер от потолка и не дотянуть
            до цели холодной ночью.
          default: 2
          selector:
            number:
              min: 0
              max: 10
              step: 1
              unit_of_measurement: A
              mode: slider

        outside_temp_sensor:
          name: "Сенсор температуры на улице (опционально)"
          description: >
            Подойдёт любой источник: сенсор автомобиля, метеостанция, погодная
            интеграция. Нужен только для режима холодной погоды ниже.
          default: []
          selector:
            entity:
              filter:
                - domain: sensor
                  device_class: temperature

        cold_threshold:
          name: "Порог холодной погоды, °C (−100 — выключено)"
          description: >
            Ниже этой температуры растяжка отключается и ток задирается на максимум.


            Причина: на морозе заметная часть энергии уходит на прогрев батареи,
            а не в её заряд. Медленная зарядка в таких условиях означает, что
            греется всё то же самое, только дольше и с худшим итоговым результатом.
            Выгоднее отдать нужные киловатт-часы быстро.
          default: -100
          selector:
            number:
              min: -100
              max: 20
              step: 1
              unit_of_measurement: "°C"
              mode: box

        cold_temp_max_age:
          name: "Максимальный возраст показания температуры, мин (0 — не проверять)"
          description: >
            Защита от залипшего сенсора: если температура не обновлялась дольше
            указанного времени, режим холодной погоды не включится. Залипшее
            значение −20 °C иначе задрало бы ток на максимум и отключило растяжку.


            **По умолчанию проверка выключена**, и для большинства это правильно.
            Погодные интеграции обновляются нечасто — раз в полчаса-час, — а зимой
            температура и вовсе может держаться одинаковой полночи. Включайте,
            только если сталкивались с зависанием конкретно вашего сенсора,
            и берите с запасом: несколько часов, а не минут.
          default: 0
          selector:
            number:
              min: 0
              max: 1440
              step: 30
              unit_of_measurement: "мин"
              mode: box

    section_throttle:
      name: "🐢 Троттлинг команд и контроль исправности"
      icon: mdi:speedometer-slow
      collapsed: false
      input:
        command_gap:
          name: "Минимальная пауза между командами, сек"
          description: >
            Повторная команда станции не уйдёт раньше, чем через это время после
            предыдущей: уставка тока — по возрасту самой уставки, включение
            и смена режима — по возрасту выключателя.


            Если пауза ещё не вышла, команда не откладывается «в паузе»,
            а просто переносится на следующий пересчёт. Первая команда сессии
            и выключение зарядки идут сразу, без ожидания.


            Многие станции плохо переносят частые команды: теряют их, уходят
            в ошибку или изнашивают память настроек.
          default: 60
          selector:
            number:
              min: 0
              max: 600
              step: 5
              unit_of_measurement: с
              mode: box

        watchdog_minutes:
          name: "Контроль «включено, но тока нет», мин (0 — выкл)"
          description: >
            Если станция включена дольше этого времени, кабель подключён,
            а тока нет — вызываются действия при ошибке. Ловит ситуацию, когда
            команда прошла, но зарядка так и не началась.


            Факт зарядки определяется по сенсору мощности, а если он не задан —
            по статусу станции. Сообщение приходит один раз, а не на каждом
            пересчёте.
          default: 15
          selector:
            number:
              min: 0
              max: 120
              step: 5
              unit_of_measurement: мин
              mode: box

        no_power_threshold:
          name: "Порог «тока нет», Вт"
          description: >
            Ниже этой мощности считается, что зарядка фактически не идёт.
            Небольшое потребление самой станции в простое не должно превышать порог.
          default: 200
          selector:
            number:
              min: 0
              max: 3000
              step: 50
              unit_of_measurement: W
              mode: box

    section_behavior:
      name: "⚙️ Поведение и защита"
      icon: mdi:shield-check
      collapsed: true
      input:
        stop_at_window_end:
          name: "Выключать зарядку в конце окна"
          description: >
            Включено — по окончании окна станция гасится, даже если цель не достигнута.
            Так нужно при льготном тарифе, чтобы не заезжать в дорогую зону.


            Выключено — начатая сессия продолжается до достижения цели.
            Ток при этом рассчитывается мягко, как на остаток длинной ночи,
            чтобы не создавать пик в дневном тарифе. Новые сессии вне окна
            всё равно не стартуют (кроме аварийной дозарядки).
          default: true
          selector:
            boolean:

        emergency_soc:
          name: "Аварийный заряд, % (0 — выключено)"
          description: >
            Если заряд упал ниже этого значения, зарядка стартует максимальным током
            независимо от окна и времени суток. Машина при этом всё равно должна быть
            в зоне и подключена кабелем. Страховка на случай, когда утром нужно
            срочно уехать.
          default: 0
          selector:
            number:
              min: 0
              max: 60
              step: 1
              unit_of_measurement: "%"
              mode: slider

        emergency_hysteresis:
          name: "Насколько дозаряжать сверх аварийного порога, %"
          description: >
            Аварийная дозарядка выключается не на самом пороге, а на столько
            процентов выше. При пороге 15 % и запасе 10 % зарядка начнётся
            ниже 15 % и закончится на 25 %.


            Зачем: остановка ровно на пороге оставила бы машину на грани, и она
            включалась бы снова при первом же колебании процента — станция
            щёлкала бы туда-сюда всю ночь. Заодно это тот запас хода, ради
            которого аварийная дозарядка и нужна.


            Больше — реже включается, но дольше заряжает вне льготного тарифа.
            Работает, только когда аварийный заряд включён (порог не 0).
          default: 10
          selector:
            number:
              min: 1
              max: 30
              step: 1
              unit_of_measurement: "%"
              mode: slider

        session_flag:
          name: "Флаг «сессия начата автоматизацией» (опционально)"
          description: >
            Вспомогательный `input_boolean`, который автоматизация включает при старте
            своей сессии и выключает при остановке.


            Зачем: по нему автоматизация отличает свою зарядку от начатой вручную.
            В чужую сессию она не вмешивается совсем — не трогает ток и не гасит
            её в конце окна. Если вы включили зарядку сами, значит и ток выставили
            какой хотели. Единственное исключение — неисправность станции: тут
            зарядка прекращается в любом случае.


            Кабель, воткнутый заранее при **выключенной** зарядке, чужой сессией
            не считается: это обычный способ поставить машину ждать ночи, и в окне
            зарядка начнётся своим порядком.


            Пока поле не заполнено, отличить ручную зарядку от своей нечем —
            Home Assistant не запоминает, кто щёлкнул выключателем, — поэтому
            любая идущая зарядка считается своей и в конце окна будет погашена.


            Создаётся в **Настройки → Устройства и службы → Вспомогательные элементы**
            как обычный переключатель.
          default: []
          selector:
            entity:
              filter:
                - domain: input_boolean

        reset_current_on_stop:
          name: "Сбрасывать ток на минимум при остановке"
          description: >
            Полезно, если вы иногда включаете станцию вручную и не хотите,
            чтобы она стартовала с максимальным током, оставшимся с ночи.
          default: false
          selector:
            boolean:

        debug_logging:
          name: "Записывать ход зарядки в журнал"
          description: >
            После **каждого** пересчёта добавляет запись в журнал Home Assistant
            (Logbook, в истории выключателя зарядки) — в том числе когда никаких
            команд не отправлялось. Запись начинается с причины решения:
            «вне окна зарядки», «машина не дома», «ток в норме», «пауза между
            командами» и так далее, а дальше идут заряд, план, напряжение и ток.


            Включите на первые ночи, чтобы увидеть всю картину сразу и не искать
            её в трассировках: журнал хранится дольше и переживает перезагрузку,
            тогда как трассировок сохраняется всего 5 штук.


            Подробности каждого пересчёта есть и в трассировке автоматизации —
            переменная `diag` (Настройки → Автоматизации → ⋮ → Трассировки,
            вкладка «Изменённые переменные»). Записи в журнале занимают место
            в базе — при штатной работе логирование можно выключить.
          default: false
          selector:
            boolean:

    section_hooks:
      name: "🔔 Уведомления"
      icon: mdi:bell-outline
      collapsed: true
      input:
        on_start_actions:
          name: "Действия при старте сессии"
          description: >
            Например, отправка уведомления на телефон. Доступные переменные:
            soc, soc_valid, plan_source, needed_kwh, desired_current, hours_left,
            charger_status, cold_mode.
          default: []
          selector:
            action:

        on_finish_actions:
          name: "Действия при завершении сессии"
          description: "Те же переменные, плюс stop_reason и target_missed."
          default: []
          selector:
            action:

        on_error_actions:
          name: "Действия при неисправности"
          description: >
            Вызывается при неисправности станции, отсутствии тока при включённой
            зарядке, недоступности или устаревании данных о заряде.
            Доступна переменная alarm_reason с причиной.
          default: []
          selector:
            action:

mode: restart

trigger_variables:
  tv_tracker: !input car_tracker
  tv_battery: !input car_battery_sensor
  tv_target: !input target_soc
  tv_zone: !input home_zone

triggers:
  - trigger: time
    at: !input start_time
    id: window_start

  - trigger: time
    at: !input stop_time
    id: window_stop

  - trigger: time_pattern
    minutes: !input recalc_interval
    id: tick

  # Уход в недоступность прогона не порождает.
  #
  # Автоматизация работает в режиме restart, а интеграция станции при обрыве
  # связи роняет все свои сущности разом и поднимает их не одновременно —
  # в реальной ночи это давало по четыре прогона за две секунды, каждый
  # из которых обрывал предыдущий на полпути. Считать по нечитаемому статусу
  # нечего, а навредить такой прогон успевает.
  #
  # Фильтруется только пункт назначения. Обратный переход — из недоступности
  # в осмысленный статус — это и есть сигнал «станция вернулась»,
  # единственный момент, когда о восстановлении вообще можно узнать;
  # not_from отменил бы вместе с шумом и его.
  - trigger: state
    entity_id: !input charger_status_sensor
    not_to: ["unknown", "unavailable"]
    id: charger_status

  # Уставка тока принята станцией. Нужен, чтобы следующая команда очереди
  # (включение) ушла сразу после паузы, а не ждала общего интервала пересчёта:
  # команды намеренно разнесены по разным прогонам, см. needs_turn_on.
  #
  # `for` здесь отсчитывается заново при каждом изменении, поэтому мигание
  # сущности отодвигало срабатывание — с фильтром недоступность паузу больше
  # не сбрасывает.
  - trigger: state
    entity_id: !input charger_current_number
    not_to: ["unknown", "unavailable"]
    for:
      seconds: !input command_gap
    id: current_written

  - trigger: homeassistant
    event: start
    id: ha_start

  # Машина оказалась в разрешённой зоне — неважно, приехала она только что
  # или GPS наконец перестал врать. Срабатывает на переход «не в зоне» → «в зоне»,
  # поэтому зарядка начнётся сразу, а не со следующего окна.
  - trigger: template
    id: car_arrived
    value_template: >-
      {% set t = tv_tracker | join('') %}
      {% if t == '' %}
        {{ false }}
      {% else %}
        {% set z = tv_zone | join('') %}
        {% set fn = state_attr(z, 'friendly_name') | default('', true) %}
        {% set zn = fn if fn != '' else z.split('.') | last | replace('_', ' ') %}
        {{ (states(t) == 'home' and z == 'zone.home')
           or (zn != '' and states(t) | lower == zn | lower) }}
      {% endif %}

  - trigger: template
    id: target_hit
    value_template: >-
      {% set b = tv_battery | join('') %}
      {{ b != '' and has_value(b) and is_number(states(b))
         and states(b) | float(0) >= tv_target | float(100) }}

variables:
  # ================= сырые входы =================
  i_switch: !input charger_switch
  i_current: !input charger_current_number
  i_status: !input charger_status_sensor
  i_power: !input charger_power_sensor
  i_ampere: !input charger_current_sensor
  i_voltage: !input charger_voltage_sensor
  i_energy: !input session_energy_sensor
  i_link: !input charger_link_sensor
  i_problem: !input charger_problem_sensor
  i_mode_select: !input charger_mode_select
  i_battery: !input car_battery_sensor
  i_stale: !input car_stale_sensor
  i_soh: !input soh_sensor
  i_otemp: !input outside_temp_sensor
  i_car_charging: !input car_charging_binary
  i_tracker: !input car_tracker
  i_zone: !input home_zone
  i_session: !input session_flag

  mode_value: !input charger_mode_value
  s_unplugged: !input status_unplugged
  s_charging: !input status_charging
  s_done: !input status_done
  s_fault: !input status_fault

  start_time_str: !input start_time
  stop_time_str: !input stop_time
  weekdays: !input weekdays
  reserve_minutes: !input time_reserve_minutes

  target_soc: !input target_soc
  energy_target: !input session_energy_target
  capacity_kwh: !input battery_capacity
  cold_threshold: !input cold_threshold
  cold_temp_max_age: !input cold_temp_max_age
  stale_max: !input car_stale_max
  soc_freeze_minutes: !input soc_freeze_minutes

  in_min_current: !input min_current
  in_max_current: !input max_current
  in_step: !input current_step
  fallback_current: !input fallback_current
  nominal_voltage: !input nominal_voltage
  i_phases: !input phases
  efficiency: !input efficiency
  deadband: !input current_deadband

  command_gap: !input command_gap
  watchdog_minutes: !input watchdog_minutes
  no_power_threshold: !input no_power_threshold

  require_home: !input require_home
  stop_at_window_end: !input stop_at_window_end
  emergency_soc: !input emergency_soc
  emergency_hysteresis: !input emergency_hysteresis
  reset_current_on_stop: !input reset_current_on_stop
  debug_logging: !input debug_logging

  # ============ нормализация в entity_id или '' ============
  e_switch: "{{ i_switch | join('') }}"
  e_current: "{{ i_current | join('') }}"
  e_status: "{{ i_status | join('') }}"
  e_power: "{{ i_power | join('') }}"
  e_ampere: "{{ i_ampere | join('') }}"
  e_voltage: "{{ i_voltage | join('') }}"
  e_energy: "{{ i_energy | join('') }}"
  e_link: "{{ i_link | join('') }}"
  e_problem: "{{ i_problem | join('') }}"
  e_mode_select: "{{ i_mode_select | join('') }}"
  e_battery: "{{ i_battery | join('') }}"
  e_stale: "{{ i_stale | join('') }}"
  e_soh: "{{ i_soh | join('') }}"
  e_otemp: "{{ i_otemp | join('') }}"
  e_car_charging: "{{ i_car_charging | join('') }}"
  e_tracker: "{{ i_tracker | join('') }}"
  e_zone: "{{ i_zone | join('') }}"
  e_session: "{{ i_session | join('') }}"

  phases_n: "{{ i_phases | int(1) }}"

  # ============ жёсткие границы тока ============
  # Приоритет у значений из настроек; атрибуты сущности могут только сузить диапазон.
  # Если минимум и максимум перепутаны местами, побеждает МАКСИМУМ: опустить
  # пол безопасно, поднять потолок — нет. Иначе перепутанные поля дали бы ток
  # выше того, что рассчитан на проводку.
  cur_step: "{{ [in_step | float(1), 0.1] | max }}"
  lim_max: "{{ in_max_current | float(28) }}"
  lim_min: "{{ [in_min_current | float(6), lim_max] | min }}"
  ent_min: "{{ state_attr(e_current, 'min') | float(0) }}"
  ent_max: "{{ state_attr(e_current, 'max') | float(9999) }}"
  num_min: "{{ [lim_min, ent_min] | max }}"
  # Потолок опускается до кратного шагу: просить 28 А у станции с шагом 5
  # бессмысленно — она округлит по-своему, а мы будем переписывать уставку
  # на каждом пересчёте, пытаясь добиться недостижимого значения.
  num_max_raw: "{{ [[lim_max, ent_max] | min, num_min] | max }}"
  num_max: >-
    {% set snapped = ((num_max_raw / cur_step) | round(0, 'floor')) * cur_step %}
    {{ [snapped, num_min] | max | round(2) }}

  # ============ состояние станции ============
  charger_online: "{{ e_link == '' or is_state(e_link, 'on') }}"
  # Выключатель существует? Если сущность переименовали или интеграция
  # не загрузилась, все команды уходили бы в никуда. Без явной проверки это
  # выглядело бы как беспричинное бездействие: возраст отсутствующей сущности
  # равен нулю, а нулевой возраст навсегда запрещает включение по троттлингу.
  #
  # Объявлено здесь, а не рядом с switch_age ниже, потому что на него
  # опирается switch_off_confirmed: в variables Home Assistant порядок
  # строгий, и ссылка на ещё не объявленное имя молча даёт пустое значение.
  switch_present: "{{ e_switch != '' and states[e_switch] is not none }}"
  switch_on: "{{ is_state(e_switch, 'on') }}"
  # «Выключено» и «сущности нет на связи» — разные вещи, и путать их дорого.
  #
  # is_state(e_switch, 'on') ложно в обоих случаях, и на этом блюпринт горел:
  # станция на две секунды теряла связь, все её сущности разом уходили
  # в unavailable, а уборка в ветке 3 читала это как «зарядку выключили руками»
  # и гасила флаг сессии. Через полторы секунды выключатель возвращался в on,
  # флаг уже был сброшен — и своя же сессия до утра считалась чужой: ни
  # регулирования тока, ни остановки в конце окна.
  #
  # Отсюда правило: воздерживаться от действий можно по любому сомнению,
  # а вот разрушительные выводы («выключили», «чужая», «неисправность»)
  # делаются только по подтверждённому состоянию.
  switch_off_confirmed: "{{ switch_present and is_state(e_switch, 'off') }}"
  charger_status: "{{ states(e_status) }}"

  # Пустые элементы отбрасываем: иначе очищенное поле превратилось бы в [''],
  # и проверка «статус не в списке» стала бы истинной для любого статуса.
  #
  # `| string` обязательно. Поле объявлено текстовым, но YAML приводит `0`
  # к числу, а у числа нет `.split` — рендер падал целиком, и автоматизация
  # не делала за ночь ничего: ни зарядки, ни остановки, ни хука ошибки.
  # Числовые статусы (0 — свободна, 1 — подключена, 2 — заряжает) обычны
  # у обёрток над OCPP и у части Tuya-станций.
  #
  # Регистр приводим к нижнему здесь и у самого статуса: станции сплошь
  # отдают CHARGING и SUSPENDED_EV, а переписывают их в поле как придётся.
  list_unplugged: "{{ (s_unplugged | string).lower().split(',') | map('trim') | reject('eq', '') | list }}"
  list_charging: "{{ (s_charging | string).lower().split(',') | map('trim') | reject('eq', '') | list }}"
  list_done: "{{ (s_done | string).lower().split(',') | map('trim') | reject('eq', '') | list }}"
  list_fault: "{{ (s_fault | string).lower().split(',') | map('trim') | reject('eq', '') | list }}"

  # Статус станции не читается. Это не повод считать кабель подключённым:
  # начинать сессию вслепую нельзя. Но и рвать уже идущую зарядку из-за
  # пропавшего сенсора не нужно — этим занимается status_known ниже.
  # Для сравнений со списками — нормализованный регистр; в журнал и в diag
  # по-прежнему идёт charger_status как есть, чтобы было видно, что реально
  # отдаёт станция.
  status_norm: "{{ charger_status | lower }}"
  status_known: "{{ status_norm not in ['unknown', 'unavailable', 'none', ''] }}"
  plugged_in: "{{ status_norm not in list_unplugged if status_known else switch_on }}"
  charger_finished: "{{ status_norm in list_done }}"
  # Неисправность объявляем только по подтверждённым данным.
  #
  # Сенсор проблемы читаем лишь при живой связи и читаемом статусе: при обрыве
  # интеграция роняет сущности станции пачкой, и binary_sensor проблемы успевает
  # отдать `on` там, где никакой неисправности нет. Во вторую реальную ночь это
  # трижды поднимало ложную тревогу и вдобавок гасило should_charge.
  #
  # Настоящая неисправность приходит иначе — изолированно, при живой связи
  # и читаемом статусе, — и такой сигнал проходит по-прежнему. Статусный fault
  # надёжнее сенсора: его станция присылает текстом, поэтому ему хватает
  # одного лишь status_known.
  charger_fault: >-
    {{ (status_known and status_norm in list_fault)
       or (e_problem != '' and charger_online and status_known
           and has_value(e_problem) and is_state(e_problem, 'on')) }}

  # ============ возраст последних команд ============
  current_age: >-
    {% set o = states[e_current] %}
    {{ 999999 if o is none else (now() - o.last_changed).total_seconds() | round(0) }}
  switch_age: >-
    {% set o = states[e_switch] %}
    {{ 0 if o is none else (now() - o.last_changed).total_seconds() | round(0) }}
  # Прошло ли достаточно времени с прошлой команды. Троттлинг сделан проверкой,
  # а не паузой: автоматизация работает в режиме restart, и любой триггер
  # (например, смена статуса станции) оборвал бы незавершённую паузу вместе
  # с командой, которая должна была идти после неё. Проверка же просто
  # откладывает запись до следующего пересчёта.
  gap_elapsed: "{{ current_age | float(0) >= command_gap | float(60) }}"
  switch_gap_elapsed: "{{ switch_age | float(0) >= command_gap | float(60) }}"

  # ============ местоположение ============
  tracker_state: "{{ states(e_tracker) if e_tracker != '' else 'unknown' }}"
  location_known: "{{ e_tracker != '' and tracker_state not in ['unknown', 'unavailable', 'none', ''] }}"
  # Трекер пишет в состояние имя зоны, поэтому сравниваем с friendly_name.
  # Если имя почему-то недоступно, откатываемся на объектный id без префикса
  # (zone.garage -> garage): иначе зона без имени навсегда запретила бы старт.
  zone_name: >-
    {% set fn = state_attr(e_zone, 'friendly_name') | default('', true) %}
    {{ fn if fn != '' else e_zone.split('.') | last | replace('_', ' ') }}
  car_home: >-
    {% if not require_home or e_tracker == '' %}
      {{ true }}
    {% elif not location_known %}
      {{ false }}
    {% else %}
      {{ (tracker_state == 'home' and e_zone == 'zone.home')
         or (zone_name != '' and tracker_state | lower == zone_name | lower) }}
    {% endif %}
  # Идущая зарядка — сама по себе доказательство, что машина на месте:
  # уехать, не отключив кабель, физически невозможно. Ночные трекеры регулярно
  # «теряют» стоящую машину, причём чаще не молчанием, а бодрым `not_home`
  # (дрейф координат по спутникам). Поэтому доверяем железу, а не трекеру:
  # если станция отдаёт ток, никакой `not_home` сессию не прерывает.
  # Проверка по мощности, а не по статусу: статус может залипнуть, а ток нет.
  physically_present: >-
    {% if not switch_on %}
      {{ false }}
    {% elif e_power != '' and has_value(e_power) %}
      {{ states(e_power) | float(0) > no_power_threshold | float(200) }}
    {% else %}
      {{ status_norm in list_charging }}
    {% endif %}
  # Начать сессию можно только при известном местоположении, продолжить —
  # если трекер замолчал ИЛИ если ток реально идёт: и «GPS потерялся», и
  # «GPS соврал» — это не «машина уехала».
  allow_start: "{{ car_home }}"
  allow_continue: >-
    {{ car_home or (not location_known) or physically_present }}
  # «Машина действительно уехала» — единственный повод гасить зарядку
  # по местоположению. Отделено в переменную, чтобы условие остановки,
  # причина остановки и вердикт не могли разъехаться между собой.
  car_left: >-
    {{ require_home and location_known and not car_home
       and not physically_present }}

  # ============ достоверность процента заряда ============
  # Шаг 1 — сущность вообще доступна? Это первое, что нужно проверять:
  # чаще всего недоступность означает слетевшую авторизацию интеграции.
  soc_present: >-
    {{ e_battery != '' and has_value(e_battery) and is_number(states(e_battery)) }}
  soc_unavailable: "{{ e_battery != '' and not soc_present }}"

  # Шаг 2 — данные не устарели?
  # Если сам сенсор возраста пуст или недоступен, это не повод хоронить процент
  # заряда: полагаемся на детектор заморозки ниже.
  soc_fresh: >-
    {% if e_stale == '' %}
      {{ true }}
    {% elif not has_value(e_stale) or not is_number(states(e_stale)) %}
      {{ true }}
    {% else %}
      {{ states(e_stale) | float(9e9) <= stale_max | float(1800) }}
    {% endif %}

  # Шаг 3 — процент не «замёрз» при реально идущем токе?
  charging_now: >-
    {% if e_power != '' and has_value(e_power) %}
      {{ states(e_power) | float(0) > no_power_threshold | float(200) }}
    {% else %}
      {{ status_norm in list_charging }}
    {% endif %}
  soc_age_min: >-
    {% set o = states[e_battery] if e_battery != '' else none %}
    {{ 0 if o is none else ((now() - o.last_changed).total_seconds() / 60) | round(1) }}
  # Сырой процент до валидации — нужен, чтобы отличить «замёрз» от «доехал».
  soc_raw: "{{ states(e_battery) | float(-1) if soc_present else -1 }}"
  # Достигнутая цель — законная причина перестать меняться, и объявлять данные
  # негодными здесь нельзя. Раньше объявлялись: машина доходила до цели,
  # станция ещё отдавала мощность (балансировка ячеек, доводка), процент
  # честно стоял на месте — и через soc_freeze_minutes срабатывал детектор.
  # Дальше по цепочке soc_valid=False гасил target_reached, а без него
  # must_stop не наступал: зарядка не выключалась, план сваливался
  # на резервный ток, а в хук ошибки уходило ложное car_data_frozen.
  soc_at_target: "{{ soc_raw | float(-1) >= target_soc | float(100) }}"
  soc_frozen: >-
    {{ soc_freeze_minutes | float(0) > 0 and soc_present
       and switch_on and charging_now and not soc_at_target
       and soc_age_min | float(0) >= soc_freeze_minutes | float(90) }}

  soc_valid: "{{ soc_present and soc_fresh and not soc_frozen }}"
  soc: "{{ states(e_battery) | float(-1) if soc_valid else -1 }}"

  soc_problem: >-
    {% if soc_unavailable %}unavailable
    {% elif soc_present and not soc_fresh %}stale
    {% elif soc_frozen %}frozen
    {% else %}none{% endif %}

  # ============ полезная ёмкость с поправкой на здоровье батареи ============
  # Часть интеграций отдаёт здоровье батареи долей (0.98), а не процентами.
  # Раньше такое значение просто зажималось нижней границей и превращалось
  # в 50 % — полезная ёмкость падала вдвое, ток занижался вдвое, и машина
  # молча не дозаряжалась. Долю распознаём по величине и переводим в проценты;
  # всё остальное вне диапазона считаем ошибкой сенсора и берём 100,
  # а не подтягиваем к границе — зажим здесь маскировал бы неверные данные.
  soh_raw: >-
    {% if e_soh != '' and has_value(e_soh) and is_number(states(e_soh)) %}
      {{ states(e_soh) | float(-1) }}
    {% else %}
      {{ -1 }}
    {% endif %}
  soh_scaled: >-
    {{ (soh_raw | float(-1) * 100) if 0 < soh_raw | float(-1) < 2
       else soh_raw | float(-1) }}
  soh_pct: >-
    {% if 50 <= soh_scaled | float(-1) <= 130 %}
      {{ soh_scaled | float(100) }}
    {% else %}
      {{ 100 }}
    {% endif %}
  effective_capacity: "{{ ((capacity_kwh | float(50)) * (soh_pct | float(100)) / 100) | round(3) }}"

  # ============ план по энергии сессии ============
  # Счётчик должен обнуляться в начале сессии. Если вместо него подключили
  # накопительный (device_class у обоих одинаковый, перепутать легко), значение
  # окажется в разы больше цели — принимать его за «уже залито» нельзя: это
  # навсегда и молча запретило бы зарядку. Такой сенсор считаем невалидным.
  #
  # Порог отсчитывается от ёмкости батареи, а не от цели: за одну сессию
  # физически нельзя залить намного больше, чем батарея вмещает. Привязка
  # к цели отвергала бы правильный счётчик при маленькой цели — перелив
  # в пару киловатт-часов сверх неё совершенно нормален.
  energy_sane_max: "{{ [effective_capacity | float(50) * 2, 20] | max }}"
  energy_plausible: >-
    {{ states(e_energy) | float(-1) >= 0
       and states(e_energy) | float(0) <= energy_sane_max | float(100) }}
  energy_valid: >-
    {{ e_energy != '' and energy_target | float(0) > 0
       and has_value(e_energy) and is_number(states(e_energy))
       and energy_plausible }}
  energy_done: "{{ states(e_energy) | float(0) if energy_valid else -1 }}"

  plan_source: >-
    {% if soc_valid %}soc{% elif energy_valid %}energy{% else %}none{% endif %}

  target_reached: >-
    {{ (soc_valid and soc >= target_soc | float(100))
       or (plan_source == 'energy' and energy_done >= energy_target | float(0)) }}
  # Аварийная дозарядка с гистерезисом: начинаем ниже порога, а прекращаем
  # только поднявшись на emergency_hysteresis выше него. Без этого зарядка
  # остановилась бы ровно на пороге и задребезжала бы вокруг него.
  emergency: >-
    {% if emergency_soc | float(0) <= 0 or not soc_valid %}
      {{ false }}
    {% elif switch_on %}
      {{ soc < emergency_soc | float(0) + emergency_hysteresis | float(10) }}
    {% else %}
      {{ soc < emergency_soc | float(0) }}
    {% endif %}
  # Началась ли текущая сессия внутри окна.
  #
  # Это нужно, чтобы отличить «доработать начатое» от аварийной дозарядки,
  # которая уже выполнила свою задачу. Блюпринт не помнит, почему сессия
  # начиналась, но возраст выключателя отвечает на вопрос честно: если
  # выключатель включён дольше, чем прошло с конца окна, значит зарядка
  # шла ещё внутри окна.
  #
  # Вне окна и до его сегодняшнего конца (то есть ночью до start_time)
  # считаем, что сессия начата не в окне: продлевать там нечего.
  window_ended_ago: >-
    {% set sp = today_at(stop_time_str) %}
    {% set n = now() %}
    {{ (n - sp).total_seconds() | round(0) if n >= sp else -1 }}
  # Известное ограничение: возраст выключателя обновляется и при уходе
  # сущности в недоступность, поэтому секундный обрыв связи омолаживает
  # выключатель до нуля, и сессия, шедшая всю ночь, выглядит начатой только
  # что. Практический эффект — «доработать начатое» отваливается, если обрыв
  # случился уже после конца окна (проверено на реальной ночи: обрыв в 07:01
  # при окне до 06:55 отключал дозарядку полностью).
  #
  # Флаг сессии на роль замены не годится, хотя обрыва он и не боится:
  # аварийная дозарядка поднимает его точно так же, и по флагу дневной
  # аварийный долив превращался бы в полноценную дневную сессию — ровно то,
  # против чего заведено это условие. Отличить одно от другого без памяти
  # между прогонами нечем, а память блюпринту недоступна.
  #
  # Цена ограничения невелика: теряется только добор после конца окна, и лишь
  # в те ночи, когда обрыв пришёлся на последние минуты. Цена ошибки в другую
  # сторону — зарядка по дневному тарифу до самого вечера.
  session_started_in_window: >-
    {{ window_ended_ago | float(-1) >= 0
       and switch_age | float(0) > window_ended_ago | float(0) }}

  # ============ холодная погода ============
  # Возраст показания проверяется, только если пользователь этого попросил:
  # погодные интеграции обновляются редко, и жёсткая проверка отключала бы
  # режим у большинства. По умолчанию порог 0 — не проверять.
  otemp_age_min: >-
    {% set o = states[e_otemp] if e_otemp != '' else none %}
    {{ 0 if o is none else ((now() - o.last_changed).total_seconds() / 60) | round(1) }}
  otemp_fresh: >-
    {{ cold_temp_max_age | float(0) <= 0
       or otemp_age_min | float(0) <= cold_temp_max_age | float(0) }}
  cold_mode: >-
    {{ e_otemp != '' and cold_threshold | float(-100) > -100
       and has_value(e_otemp) and is_number(states(e_otemp)) and otemp_fresh
       and states(e_otemp) | float(99) < cold_threshold | float(-100) }}

  # ============ окно ============
  # Пустой список дней трактуем как «все дни»: снятые в интерфейсе галочки
  # чаще означают недосмотр, чем желание навсегда отключить автоматизацию.
  weekday_ok: >-
    {% set st = today_at(start_time_str) %}
    {% set sp = today_at(stop_time_str) %}
    {% set n = now() %}
    {% set ref = (n - timedelta(days=1)) if (st > sp and n < sp) else n %}
    {{ weekdays | count == 0
       or ['mon','tue','wed','thu','fri','sat','sun'][ref.weekday()] in weekdays }}

  in_window: >-
    {% set st = today_at(start_time_str) %}
    {% set sp = today_at(stop_time_str) %}
    {% set n = now() %}
    {% if st < sp %}{% set inside = (st <= n and n < sp) %}
    {% elif st > sp %}{% set inside = (n >= st or n < sp) %}
    {% else %}{% set inside = true %}{% endif %}
    {{ inside and weekday_ok }}

  # Сколько времени осталось до конца окна.
  #
  # Вне окна планировать по календарю нечего: ближайший конец окна может
  # отстоять почти на сутки, и растяжка выродилась бы в минимальный ток.
  # Но и один ответ на все случаи не годится, потому что вне окна зарядка
  # идёт по двум разным поводам:
  #
  #   - аварийная дозарядка — смысл ровно в том, чтобы залить быстро,
  #     поэтому горизонт короткий и ток уходит на максимум;
  #   - «доработать начатое» (окно кончилось, цель не достигнута) — здесь
  #     спешить некуда, и разумнее доливать мягко, не создавая пик в дневном
  #     тарифе. Берём типичный остаток ночи.
  hours_left: >-
    {% set st = today_at(start_time_str) %}
    {% set sp = today_at(stop_time_str) %}
    {% set n = now() %}
    {% if in_window %}
      {% set sp = (sp + timedelta(days=1)) if sp <= n else sp %}
      {% set sec = (sp - n).total_seconds() - (reserve_minutes | float(0)) * 60 %}
      {{ [sec / 3600, 0.0834] | max | round(4) }}
    {% elif emergency %}
      {{ 0.0834 }}
    {% else %}
      {{ 8 }}
    {% endif %}

  # ============ электрика ============
  # Уставка тока — то, что мы просим у станции.
  current_now: "{{ states(e_current) | float(0) }}"
  # Фактический ток — то, что реально идёт. Обычно немного меньше уставки.
  actual_current: >-
    {{ states(e_ampere) | float(0) if (e_ampere != '' and has_value(e_ampere)) else 0 }}
  actual_power: >-
    {{ states(e_power) | float(0) if (e_power != '' and has_value(e_power)) else 0 }}

  # Источник №1 — прямое измерение.
  live_voltage: >-
    {{ states(e_voltage) | float(0) if (e_voltage != '' and has_value(e_voltage)) else 0 }}
  # Источник №2 — вычисление из мощности и фактического тока.
  # Даёт реальное напряжение под нагрузкой даже без сенсора напряжения.
  derived_voltage: >-
    {% if actual_current > 0.5 and actual_power > no_power_threshold | float(200) %}
      {{ (actual_power / (actual_current * phases_n)) | round(1) }}
    {% else %}
      {{ 0 }}
    {% endif %}

  # Диапазон правдоподобия одинаков для обоих измерений: сенсор, отдающий
  # милливольты или мусор из битого регистра, не должен приниматься за истину —
  # завышенное напряжение занизило бы ток до минимума на всю ночь.
  voltage_source: >-
    {% if live_voltage >= 175 and live_voltage <= 280 %}sensor
    {% elif derived_voltage >= 175 and derived_voltage <= 280 %}derived
    {% else %}fallback{% endif %}
  voltage: >-
    {% if voltage_source == 'sensor' %}{{ live_voltage }}
    {% elif voltage_source == 'derived' %}{{ derived_voltage }}
    {% else %}{{ nominal_voltage | float(230) }}{% endif %}

  # ============ расчёт ============
  # round(4) здесь не косметика, а защита от отказа всей автоматизации.
  #
  # Home Assistant превращает результат шаблона в число, только если строка
  # похожа на число по его собственной мерке (^[+-]?(?!0\d)\d*(?:\.\d*)?$) —
  # научная нотация под неё не подходит и остаётся СТРОКОЙ. А Jinja печатает
  # научную нотацию сама, стоит остатку стать меньше 1e-4: машина, отдающая
  # процент с четырьмя знаками (Tesla, BMW, Renault), при цели 100 % и заряде
  # 99.9999 давала needed_kwh = '4.886363636525847e-05'. Дальше по цепочке
  # строка умножалась на 1000, деление на hours_left роняло рендер целиком,
  # и автоматизация не делала за ночь ничего — ни зарядки, ни остановки,
  # ни хука ошибки. Округление до четырёх знаков (0.1 Вт·ч) удерживает запись
  # в обычном десятичном виде; на расчёт тока такая точность не влияет.
  needed_kwh: >-
    {% if plan_source == 'soc' %}
      {% set delta = [target_soc | float(100) - soc, 0] | max %}
      {{ ((delta / 100 * (effective_capacity | float(50)))
          / ([efficiency | float(88), 1] | max / 100)) | round(4) }}
    {% elif plan_source == 'energy' %}
      {{ ([energy_target | float(0) - energy_done, 0] | max) | round(4) }}
    {% else %}
      {{ 0 }}
    {% endif %}

  calc_current: >-
    {% if emergency or cold_mode %}
      {{ num_max }}
    {% elif plan_source == 'none' %}
      {# Данные пропали. Резервный ток — это ответ для НАЧАЛА сессии;
         посреди идущей зарядки опускаться ниже уже работающего тока нельзя.
         Раньше опускались: при отставании от плана уставка 22 А сваливалась
         на резервные 10 А ровно тогда, когда не хватало и 22, а на 10 А
         процент растёт втрое медленнее — то есть отставание только росло. #}
      {{ [fallback_current | float(10), current_now if switch_on else 0] | max }}
    {% else %}
      {% set watts = needed_kwh * 1000 / hours_left %}
      {{ (watts / ([voltage * phases_n, 1] | max)) | round(3) }}
    {% endif %}

  # Разрыв между заказанным током и фактическим — величина для диагностики,
  # а не для автоматической правки. На реальном железе он оказался
  # постоянным: уставка 16 А давала 14.69 А, уставка 19 А — 17.66 А, обе ночи,
  # все пересчёты, разброс в сотые доли. Это не потери в проводах (росли бы
  # с током) и не предел машины (та брала 17.66 А), а смещение самой станции.
  #
  # Компенсировать его прибавкой к расчётному току нельзя, хотя соблазн
  # очевиден. Любая такая добавка уходит в desired_current, а тот сравнивается
  # с уставкой в зоне нечувствительности — то есть постоянный разрыв
  # притворился бы вечным расхождением плана и переписывал бы уставку
  # на каждом пересчёте. Ровно от этого защищает
  # test_the_deadband_compares_setpoint_with_setpoint.
  #
  # Через КПД разрыв тоже не выражается: в долях он непостоянен — 92 % при
  # уставке 16 А, но 78 % при 6 А и 95 % при 28 А.
  #
  # Поэтому величина просто измеряется и показывается: в журнале и в diag
  # видно, сколько станция недодаёт, а вывод — занизить КПД в настройках —
  # остаётся за человеком. Описано в документации, раздел «Настройка».
  current_shortfall: >-
    {% if e_ampere == '' or not switch_on or not charging_now
          or current_now | float(0) <= 0 or actual_current | float(0) <= 0.5 %}
      {{ 0 }}
    {% else %}
      {{ [current_now | float(0) - actual_current | float(0), 0] | max | round(2) }}
    {% endif %}

  # То же число для показа человеку. В последние минуты окна горизонт
  # планирования сжимается до секунд, и расчёт выдаёт сотни ампер: на уставку
  # это не влияет (её ограничивает потолок), но «расчёт 495 А» в журнале
  # выглядит как поломка и сбивает с толку при разборе ночи. Само
  # calc_current остаётся сырым — по нему видно, что станции не хватает.
  calc_current_shown: "{{ [calc_current | float(0), num_max] | min | round(2) }}"

  desired_current: >-
    {% set c = [[calc_current | float(6), num_min] | max, num_max] | min %}
    {% set snapped = ((c / cur_step) | round(0, 'ceil')) * cur_step %}
    {{ [[snapped, num_min] | max, num_max] | min | round(2) }}

  # Зона нечувствительности гасит косметические правки, но не должна мешать
  # выйти на потолок: если план требует именно максимума, значит мы отстаём
  # от графика, и лишний ампер здесь решает, доедет машина до цели или нет.
  #
  # Нижняя граница в этот список не входит намеренно. Под утро, когда машина
  # почти заряжена, план колеблется около минимума (6 → 7 → 6 → 7 А), и раньше
  # каждое такое колебание проламывало зону нечувствительности: в симуляции
  # это давало одиннадцать записей за ночь вместо восьми, причём девять из них
  # меняли направление. Ток при этом уже минимальный — разница в один ампер
  # ни на что не влияет, а команды станции изнашивают её вхолостую.
  at_boundary: "{{ desired_current >= num_max }}"
  # Уставку станции сравниваем с допуском в половину шага: станция может
  # рапортовать 27.9 там, где мы просили 28, и точное сравнение заставляло бы
  # переписывать уставку на каждом пересчёте в обход зоны нечувствительности.
  setpoint_differs: "{{ (desired_current - current_now) | abs > cur_step | float(1) / 2 }}"
  # ============ своя сессия или чужая ============
  # Чужая — это когда зарядку включили руками: флаг сессии остался выключенным,
  # хотя выключатель уже включён.
  #
  # В чужую сессию автоматизация не вмешивается совсем: не трогает ток и не
  # гасит её в конце окна. Человек, включивший зарядку вручную, выставил
  # тот ток, который хотел, — перебивать его расчётом неправильно.
  #
  # Кабель, воткнутый заранее при выключенной зарядке, чужой сессией не
  # считается: там включаем и ведём зарядку обычным порядком.
  #
  # Без флага сессии отличить ручную зарядку от своей нечем — Home Assistant
  # не помнит, кто щёлкнул выключателем, — поэтому без него любая идущая
  # зарядка считается своей.
  # Недоступный флаг — это «неизвестно, чья сессия», а не «чужая». При
  # перезапуске Home Assistant input_boolean проходит через unknown до
  # восстановления, и без этой оговорки собственная зарядка на первом же
  # прогоне объявлялась бы чужой со всеми последствиями ниже.
  session_flag_readable: "{{ e_session != '' and has_value(e_session) }}"
  session_owned: >-
    {{ e_session == '' or not session_flag_readable or is_state(e_session, 'on') }}
  # Чужой сессию делает только включённый выключатель при читаемом опущенном
  # флаге. Мигание любой из двух сущностей — не повод.
  #
  # session_flag_readable здесь логически избыточен (нечитаемый флаг уже даёт
  # session_owned выше), но оставлен намеренно: объявить чужой чью-то зарядку —
  # решение с ценой в целую ночь, и условие, при котором это происходит,
  # должно читаться целиком в одном месте, а не собираться из двух.
  foreign_session: >-
    {{ switch_on and session_flag_readable and not session_owned }}
  # Сессия наша, но флаг потерян: зарядка идёт, а признака владения нет.
  #
  # Так выглядела вторая реальная ночь. Обрыв связи сбросил флаг, через
  # полторы секунды выключатель вернулся в on — и выхода из этого состояния
  # не существовало: флаг поднимался только в ветке включения, а она требует
  # выключенной станции. Семь часов автоматизация считала свою же зарядку
  # чужой, не трогала ток и не погасила её в конце окна.
  #
  # Флаг сессии, оставшийся поднятым при выключенной станции. Сбросить его
  # в ветке остановки недостаточно: та достижима только при must_stop, а он
  # требует switch_on. Если зарядку выключили вручную, или станция погасла
  # сама по неисправности, или Home Assistant перезапустился между двумя
  # командами, флаг оставался поднятым навсегда — и следующая ручная зарядка
  # считалась нашей, то есть автоматизация перебивала выставленный человеком
  # ток. Ровно то, против чего флаг и заведён.
  # Три оговорки, каждая куплена реальной ночью:
  #
  # switch_off_confirmed вместо `not switch_on` — недоступный выключатель
  # больше не считается выключенным. Ровно на этом сбрасывался флаг живой
  # сессии при двухсекундном обрыве связи.
  #
  # charger_online и status_known — пока станция не на связи, о её выключателе
  # мы ничего не знаем, и убирать за сессией нечего. Прежде ветка уборки
  # работала даже тогда, когда блюпринт сам признавал станцию офлайн: полезные
  # команды он в этом состоянии не слал, а разрушительную — слал.
  #
  # Выдержка по switch_gap_elapsed: настоящее ручное выключение спокойно
  # переживёт один пересчёт, а дребезг сущности — нет.
  session_flag_stuck: >-
    {{ e_session != '' and session_flag_readable and is_state(e_session, 'on')
       and switch_off_confirmed and charger_online and status_known
       and switch_gap_elapsed }}

  # Зона нечувствительности применяется НЕсимметрично, и это принципиально.
  #
  # Просьба поднять ток означает, что по расчёту мы не укладываемся в окно:
  # заглушить её — значит сознательно не долить. Именно так и вышло в первую
  # же ночь: расчёт четыре раза подряд просил 20–21 А при уставке 19 А, каждая
  # попытка гасилась зоной в 3 А, и до цели машина не дошла. Поэтому вверх
  # пишем при отличии хотя бы в один шаг станции.
  #
  # Просьба снизить ток такой срочности не имеет: лишний ампер не мешает
  # доехать до цели, а перезапись ради долей ампера изнашивает станцию.
  # Здесь зона работает в полную силу — именно ради этого случая она и вводилась.
  current_rising: "{{ desired_current > current_now }}"
  # Перед стартом сессии зона нечувствительности не применяется: уходить
  # в ночь с прошлогодней уставкой нельзя. Но и переписывать значение, которое
  # уже верное, тоже не нужно — иначе включение, стоящее в очереди следом,
  # не наступит никогда.
  #
  # Допуск даже на подъёме не нулевой, а в половину шага станции. Нулевой
  # допуск означает «переписывать при любом расхождении», а расхождение бывает
  # неустранимым: станция с внутренним шагом 0.5 А на команду 28 А рапортует
  # 27.5 и будет рапортовать так всегда. С нулевым допуском мы писали бы ей
  # одно и то же значение каждые command_gap секунд до утра — ровно тот износ,
  # против которого и заведён троттлинг. Полшага заведомо меньше одного шага,
  # поэтому законное повышение на шаг вверх проходит по-прежнему.
  rise_tolerance: "{{ cur_step | float(1) / 2 }}"
  want_write: >-
    {{ (desired_current - current_now) | abs
         > (rise_tolerance | float(0.5)
            if (current_rising or not switch_on)
            else [deadband | float(2), rise_tolerance | float(0.5)] | max)
       or (at_boundary and setpoint_differs) }}

  # Свою потерянную сессию от чужой отличает уставка, а не время.
  #
  # Соблазн судить по возрасту («ручную включили только что, наша идёт давно»)
  # проверен на трассировках и отвергнут: обрыв связи роняет выключатель
  # и уставку одновременно, поэтому после него их возрасты неотличимы от любых
  # других. Человек же волен щёлкнуть выключателем и в три часа ночи —
  # захватывать такую сессию нельзя, иначе флаг теряет весь смысл.
  #
  # Работает вот что: включая зарядку, мы всегда сначала пишем уставку — это
  # заданная в needs_turn_on очередь команд. Поэтому у своей сессии уставка
  # сходится с расчётом, где «сходится» означает «в пределах зоны
  # нечувствительности», иначе мы бы её уже переписывали. Человек ставит ток
  # по своему разумению, и совпасть с плавающим ночным расчётом он может
  # разве что случайно.
  #
  # Объявлено здесь, сразу за want_write: в variables порядок строгий,
  # а ссылка на ещё не объявленное имя молча даёт пустое значение.
  #
  # Признак не идеален — совпадение возможно, — но ошибка в эту сторону
  # безобидна: чужую сессию с уже верным током мы вели бы теми же значениями.
  # Обратная ошибка, как показала вторая ночь, стоит целой ночи.
  session_lost: >-
    {{ e_session != '' and session_flag_readable and switch_on
       and not is_state(e_session, 'on')
       and status_known and charger_online and not want_write }}

  # Переключение режима станции. Пустое значение режима не пишем: команда
  # с пустой опцией всё равно отвергается станцией, а continue_on_error
  # проглотил бы ошибку молча, и режим не выставлялся бы никогда.
  needs_mode_write: >-
    {{ e_mode_select != '' and mode_value != '' and not foreign_session
       and not is_state(e_mode_select, mode_value)
       and (switch_gap_elapsed or not switch_on) }}
  # Записываем, только если пауза между командами уже выдержана. Первая команда
  # сессии (станция ещё выключена) идёт без ожидания — иначе старт зарядки
  # откладывался бы на весь интервал троттлинга.
  # `status_known` обязателен: идущую зарядку из-за пропавшего сенсора рвать
  # не нужно (см. plugged_in), но и регулировать её вслепую — тоже. Раньше
  # регулировали: сенсор статуса уходил в unavailable, а автоматизация
  # продолжала писать в станцию, связь с которой потеряна, и в журнале это
  # выглядело как штатная работа. Теперь уставка замирает до восстановления.
  needs_write: >-
    {{ want_write and not foreign_session and status_known
       and (gap_elapsed or not switch_on) }}
  # Команда включения. Троттлится по возрасту самого выключателя: если станция
  # приняла команду, но не включилась (ровно тот случай, ради которого нужен
  # watchdog), повтор пойдёт не раньше чем через паузу, а хук старта не будет
  # срабатывать на каждом пересчёте.
  #
  # Вторая часть условия — очередь команд. Дешёвые станции (Tuya и родня)
  # теряют команду, пришедшую вплотную к предыдущей: в первую же ночь уставка
  # тока и включение ушли с интервалом 14 мс. Блокирующая пауза здесь не
  # годится — автоматизация работает в режиме restart, а статус станции при
  # старте меняется дважды за пять секунд (plugged_in -> waiting -> charging)
  # и оборвал бы delay вместе с невыполненным включением.
  # Поэтому команды разносятся по разным прогонам: раз уставку пишем сейчас,
  # включение подождёт следующего. Ждать полный интервал пересчёта не придётся —
  # смена уставки сама по себе является триггером.
  # switch_off_confirmed, а не `not switch_on`: включать имеет смысл только то,
  # что подтверждённо выключено. Недоступный выключатель — это не выключенный,
  # команда ушла бы в интеграцию, которой нет, а вместе с ней сработал бы хук
  # старта, и посреди ночи прилетало бы «зарядка началась» на каждый обрыв
  # связи. Настоящий старт от этого не страдает: там выключатель честно
  # отдаёт `off`.
  needs_turn_on: >-
    {{ switch_off_confirmed and switch_gap_elapsed and not needs_write }}
  # Первая попытка старта против повтора.
  #
  # Команда включения всегда идёт следом за записью уставки — это очередь,
  # заданная в needs_turn_on. Поэтому у только что начатой сессии уставка
  # свежая, а у застрявшей (станция игнорирует включение уже который пересчёт)
  # успевает состариться. Судить по возрасту самого выключателя нельзя:
  # при пересчёте раз в полчаса он почти всегда старый, и уведомление
  # о нормальном старте не пришло бы вовсе.
  first_turn_on_attempt: >-
    {{ current_age | float(9e9) < [command_gap | float(60) * 3, 300] | max }}

  # ============ решение ============
  # switch_present стоит первым: без выключателя вся ветка бессмысленна.
  # Раньше его проверял только вердикт, и при переименованной сущности
  # (или незагрузившейся интеграции станции) автоматизация продолжала считать
  # план, писать ток и звать хук старта — команды уходили в никуда, а ошибку
  # глотал continue_on_error. В журнале это выглядело как штатная работа.
  # «Доработать начатое» продлевает только ту сессию, что шла внутри окна.
  # Раньше условие было шире, и аварийная дозарядка днём превращалась
  # в полноценную дневную сессию: гистерезис гасил emergency на пороге+10,
  # но дизъюнкт (switch_on and not stop_at_window_end) тут же подхватывал
  # зарядку и вёл её до 100 % по дневному тарифу. Описание параметра обещает
  # обратное — аварийная дозарядка это исключение для СТАРТА, а не разрешение
  # доливать весь день.
  finish_started_session: >-
    {{ switch_on and not stop_at_window_end and session_started_in_window }}
  should_charge: >-
    {{ switch_present
       and charger_online
       and (in_window or emergency or finish_started_session)
       and plugged_in
       and not target_reached
       and not charger_finished
       and not charger_fault
       and (allow_continue if switch_on else allow_start) }}


  # Осмысленно только в момент завершения сессии (хук on_finish_actions):
  # там «цель не достигнута» — итог ночи. В любой другой момент флаг истинен
  # просто потому, что зарядка ещё идёт, и как признак проблемы не читается.
  target_missed: "{{ not target_reached and not charger_finished }}"

  # Чужую сессию по общему правилу не гасим: раз её включали не мы, то и
  # выключать — не наше дело. Но «вежливость» не должна отменять причины,
  # которые к чужому выбору отношения не имеют.
  #
  # Раньше исключение было одно — неисправность, — и весь список причин
  # висел на единственном признаке foreign_session. Стоило тому оказаться
  # ложным (а во вторую ночь он оказался ложным из-за потерянного флага),
  # как разом отключались все остановки: и конец окна, и достигнутая цель,
  # и уехавшая машина. Зарядка лилась ещё двадцать три минуты после окна.
  #
  # Поэтому причины разделены. Уважение к чужому выбору — это про ток
  # и про конец окна: человек сам решил, сколько ему заливать. Всё
  # остальное — неисправность, уехавшая машина, выдернутый кабель,
  # достигнутая цель, рапорт станции «заряжено» — к его выбору не относится
  # и требует реакции независимо от того, кто нажал кнопку.
  stop_regardless_of_owner: >-
    {{ charger_fault
       or car_left
       or (status_known and not plugged_in)
       or target_reached
       or charger_finished }}
  must_stop: >-
    {{ switch_on and not should_charge and charger_online
       and (stop_regardless_of_owner or not foreign_session)
       and (
         stop_regardless_of_owner
         or ((not in_window) and stop_at_window_end)
         or ((not in_window) and not finish_started_session)
       ) }}

  # Причина остановки. Порядок ветвей тот же, что у verdict, иначе одна
  # и та же остановка называлась бы в журнале и в трассировке по-разному:
  # уехавшая машина неизбежно уносит с собой кабель, и без общего порядка
  # `unplugged` затирал бы настоящую первопричину.
  #
  # Объявлено ПОСЛЕ must_stop, потому что первым делом на него и смотрит:
  # вне остановки — 'none'. Без этой проверки ветки ниже истинны и во
  # множестве ситуаций, где зарядка спокойно продолжается (чужая сессия при
  # достигнутой цели давала 'target_reached', нечитаемый статус при идущей
  # зарядке — 'status_unknown'), а любое значение здесь читается как причина.
  stop_reason: >-
    {% if not must_stop %}none
    {% elif charger_fault %}fault
    {% elif target_reached %}target_reached
    {% elif charger_finished %}charger_reports_charged
    {% elif car_left %}car_not_home
    {% elif not plugged_in %}unplugged
    {% elif not status_known %}status_unknown
    {% elif not in_window %}window_end
    {% else %}none{% endif %}
    {#- Ветки charger_offline здесь нет намеренно: must_stop требует
        charger_online, то есть офлайн-станцию мы и не гасим — её нечем гасить.
        Пока причина считалась вне остановки, ветка выглядела осмысленной;
        теперь она была бы недостижимым кодом, вводящим в заблуждение. -#}

  # ============ контроль исправности ============
  # «Включено, но ток не идёт». Верхняя граница по времени нужна, чтобы
  # уведомление не повторялось на каждом пересчёте всю ночь: сообщаем только
  # в первом окне после истечения таймаута, дальше молчим.
  # Работает и без сенсора мощности: charging_now в этом случае опирается
  # на статус станции. Требовать сенсор значило бы молча отключать watchdog
  # там, где он нужнее всего.
  no_power_alarm: >-
    {{ watchdog_minutes | float(0) > 0 and switch_on and plugged_in
       and (e_power == '' or has_value(e_power))
       and switch_age | float(0) >= watchdog_minutes | float(15) * 60
       and switch_age | float(0) < watchdog_minutes | float(15) * 60 + 3600
       and not charging_now }}

  car_says_charging: >-
    {{ 'unknown' if e_car_charging == '' or not has_value(e_car_charging)
       else ('yes' if is_state(e_car_charging, 'on') else 'no') }}

  # О проблемах с данными сообщаем только во время своей сессии,
  # чтобы не слать уведомления круглосуточно, пока машина просто спит.
  #
  # В отличие от watchdog выше, окна «сообщить один раз» здесь нет намеренно.
  # Такое окно требует знать, как давно проблема длится, а блюпринт не хранит
  # состояние между прогонами: возраст самих данных для этого не годится
  # (сенсор мог замереть ещё до начала сессии, и окно оказалось бы закрыто
  # с первого же пересчёта — тогда о реальной проблеме не сообщили бы вовсе).
  # Поэтому пока данные негодны, хук ошибки вызывается на каждом пересчёте;
  # гасить повторы, если они мешают, следует в самом действии уведомления.
  data_alarm: "{{ switch_on and soc_problem != 'none' }}"

  alarm_reason: >-
    {% if not switch_present %}switch_entity_missing
    {% elif charger_fault %}charger_fault
    {% elif no_power_alarm and car_says_charging == 'no' %}car_refused_charge
    {% elif no_power_alarm and car_says_charging == 'yes' %}charger_reports_no_power_but_car_charging
    {% elif no_power_alarm %}no_power_while_on
    {% elif data_alarm and soc_problem == 'unavailable' %}car_data_unavailable_check_integration_auth
    {% elif data_alarm and soc_problem == 'stale' %}car_data_stale
    {% elif data_alarm and soc_problem == 'frozen' %}car_data_frozen
    {% else %}none{% endif %}

  # ============ диагностика ============
  # Единая причина принятого решения — то, чего не хватает при разборе
  # «почему ночью ничего не произошло». Считается для любого исхода, включая
  # бездействие: у stop_reason такой задачи нет, он объясняет только остановку
  # и вне этого контекста вводит в заблуждение (офлайн станция даёт 'other',
  # нечитаемый статус — 'unplugged', хотя кабель может быть воткнут).
  # Порядок ветвей повторяет порядок проверок в should_charge и must_stop,
  # поэтому названная причина — всегда первая по счёту, а не любая из
  # действующих. Объявляется после тревог, чтобы «включено, но ток не идёт»
  # не выглядело в журнале как штатное «ток в норме».
  verdict: >-
    {% if not switch_present %}выключатель {{ e_switch if e_switch != '' else '(не выбран)' }} не найден — проверьте сущность
    {% elif not charger_online %}станция офлайн
    {% elif charger_fault %}неисправность станции
    {% elif not status_known and not switch_on %}статус станции нечитаем, старт вслепую запрещён
    {% elif not status_known %}статус станции нечитаем, ток не трогаем до восстановления связи
    {% elif car_left %}машина не дома
    {% elif not plugged_in %}кабель не подключён
    {% elif target_reached %}цель достигнута
    {% elif charger_finished %}станция сообщает «заряжено»
    {% elif foreign_session %}зарядка начата вручную, не вмешиваемся
    {% elif not in_window and not emergency and not switch_on %}вне окна зарядки
    {% elif not in_window and stop_at_window_end and switch_on %}окно закончилось
    {% elif not switch_on and needs_write %}ставим ток {{ desired_current }} А, включим следующим шагом
    {% elif not switch_on and not switch_gap_elapsed %}пауза между командами ({{ [command_gap | float(60) - switch_age | float(0), 0] | max | round(0) }} с)
    {% elif not switch_on %}запускаем зарядку
    {% elif no_power_alarm %}включено, но ток не идёт ({{ alarm_reason }})
    {% elif needs_write %}меняем ток {{ current_now }} → {{ desired_current }} А
    {% elif want_write and not gap_elapsed %}ток надо менять, но идёт пауза ({{ (command_gap | float(60) - current_age | float(0)) | round(0) }} с)
    {% elif data_alarm %}ток в норме, но данные о заряде ненадёжны ({{ soc_problem }})
    {% elif not want_write %}ток в норме, отличие меньше зоны нечувствительности
    {# Последняя ветка недостижима: перебор 720 сочетаний часа, статуса,
       заряда, уставки и состояния выключателя даёт 33 разных вердикта,
       и ни одного «без изменений». Оставлена намеренно — пустой вердикт
       в журнале хуже лишней строчки кода, а ветви выше со временем меняются. #}
    {% else %}без изменений{% endif %}

  # ============ слепок для трассировки ============
  # Всё, что нужно для разбора одного пересчёта, собрано в один объект.
  # Трассировка Home Assistant показывает переменные плоским списком из полутора
  # сотен имён, где значимое тонет среди служебного; здесь же видна вся картина
  # сразу, а вложенные словари в трассировке разворачиваются как дерево.
  # Объявляется последним: читает готовые значения, сам ни на что не влияет.
  #
  # Флаги в группе «команды» показывают, что РЕАЛЬНО уйдёт в станцию, поэтому
  # домножены на should_charge: пока он ложен, вся ветка записи недостижима,
  # и «включить: да» означало бы намерение, которого нет — при разборе ночи это
  # читается как «собирались включить, но почему-то не включили».
  diag: >-
    {{ {
      'вердикт': verdict,
      'решение': {
        'заряжать': should_charge,
        'остановить': must_stop,
        'причина_остановки': stop_reason,
        'тревога': alarm_reason,
        'чужая_сессия': foreign_session,
      },
      'команды': {
        'записать_ток': needs_write and should_charge,
        'включить': needs_turn_on and should_charge,
        'выставить_режим': needs_mode_write and should_charge,
        'ток_отличается': want_write,
        'ток_растёт': current_rising,
        'пауза_вышла': gap_elapsed,
        'пауза_выключателя_вышла': switch_gap_elapsed,
      },
      'ток': {
        'уставка_сейчас': current_now,
        'уставка_нужна': desired_current,
        'расчёт_до_округления': calc_current_shown,
        'расчёт_сырой': calc_current,
        'идёт_по_факту': actual_current if e_ampere != '' else 'н/д',
        'недодача_а': current_shortfall if e_ampere != '' else 'н/д',
        'мощность_вт': actual_power if e_power != '' else 'н/д',
        'границы': [num_min, num_max],
        'шаг': cur_step,
        'зона_нечувствительности': deadband,
        'на_границе': at_boundary,
        'возраст_уставки_с': current_age,
      },
      'план': {
        'источник': plan_source,
        'нужно_квтч': needed_kwh | round(2),
        'часов_осталось': hours_left,
        'ёмкость_квтч': effective_capacity,
        'напряжение': voltage,
        'источник_напряжения': voltage_source,
        'фаз': phases_n,
        'кпд': efficiency,
        'мороз': cold_mode,
      },
      'заряд': {
        'процент': soc if soc_valid else 'н/д',
        'цель': target_soc,
        'достигнута': target_reached,
        'данные_валидны': soc_valid,
        'проблема': soc_problem,
        'не_менялся_мин': soc_age_min,
        'отдано_квтч': energy_done if energy_valid else 'н/д',
      },
      'станция': {
        'выключатель': 'вкл' if switch_on else 'выкл',
        'возраст_выключателя_с': switch_age,
        'статус': charger_status,
        'статус_читается': status_known,
        'кабель_подключён': plugged_in,
        'на_связи': charger_online,
        'неисправность': charger_fault,
        'заряжает_по_факту': charging_now,
        'машина_подтверждает': car_says_charging,
      },
      'окно': {
        'внутри': in_window,
        'начало': start_time_str,
        'конец': stop_time_str,
        'день_подходит': weekday_ok,
        'резерв_мин': reserve_minutes,
        'аварийная_дозарядка': emergency,
      },
      'место': {
        'машина_дома': car_home,
        'положение_известно': location_known,
        'трекер': tracker_state,
        'зона': zone_name,
        'требовать_дом': require_home,
        'ток_подтверждает_присутствие': physically_present,
        'машина_уехала': car_left,
      },
    } }}

actions:
  # ---------- контроль исправности ----------
  - if:
      - condition: template
        value_template: "{{ alarm_reason != 'none' }}"
    then:
      - sequence: !input on_error_actions

  - choose:
      # ================= ВЕТКА 1: заряжаем =================
      - conditions:
          - condition: template
            value_template: "{{ should_charge }}"
        sequence:
          # 0. возврат владения сессией.
          #
          # Флаг мог потеряться при живой зарядке: станция на пару секунд
          # теряет связь, все её сущности разом уходят в unavailable, уборка
          # читает это как «выключили руками» и гасит флаг. Через полторы
          # секунды выключатель возвращается — и своя же сессия считается
          # чужой. Пока этого шага не было, состояние было необратимым:
          # поднять флаг умела только ветка включения ниже, а она требует
          # выключенной станции. Вторая реальная ночь так и прошла: семь
          # часов без регулирования тока и без остановки в конце окна.
          #
          # Стоит первым в ветке: foreign_session блокирует и запись уставки,
          # и смену режима, поэтому владение нужно вернуть прежде команд.
          # Само условие узкое (см. session_lost) — ручную зарядку не тронет.
          - if:
              - condition: template
                value_template: "{{ session_lost }}"
            then:
              - action: input_boolean.turn_on
                continue_on_error: true
                target:
                  entity_id: "{{ e_session }}"

          # 1. режим станции -> ручной
          - if:
              - condition: template
                value_template: "{{ needs_mode_write }}"
            then:
              - action: select.select_option
                continue_on_error: true
                target:
                  entity_id: "{{ e_mode_select }}"
                data:
                  option: "{{ mode_value }}"

          # 2. уставка тока. Пауза между командами уже учтена в needs_write,
          # поэтому здесь блокирующих задержек нет: в режиме restart любой
          # триггер оборвал бы их вместе с самой командой.
          - if:
              - condition: template
                value_template: "{{ needs_write }}"
            then:
              - action: number.set_value
                continue_on_error: true
                target:
                  entity_id: "{{ e_current }}"
                data:
                  value: "{{ desired_current }}"

          # 3. включение
          - if:
              - condition: template
                value_template: "{{ needs_turn_on }}"
            then:
              # Флаг поднимается ПЕРЕД включением, и порядок здесь принципиален.
              #
              # Автоматизация работает в режиме restart, а включение станции
              # само меняет её статус — то есть срабатывает наш же триггер
              # и обрывает эту последовательность. Пока флаг стоял вторым,
              # существовало окно в доли секунды, в котором станция уже
              # включена, а владение ещё не отмечено: дальше своя же сессия
              # до утра считалась чужой, со всеми последствиями.
              #
              # Обратный порядок безопасен по несимметричной цене ошибки.
              # Лишний поднятый флаг (команда включения не прошла) убирается
              # штатной уборкой в ветке 3 на следующем же пересчёте, а вот
              # потерянный флаг при живой зарядке не чинился ничем.
              - if:
                  - condition: template
                    value_template: "{{ e_session != '' }}"
                then:
                  - action: input_boolean.turn_on
                    continue_on_error: true
                    target:
                      entity_id: "{{ e_session }}"
              - action: switch.turn_on
                continue_on_error: true
                target:
                  entity_id: "{{ e_switch }}"
              # Уведомляем только о первой попытке старта. Если станция
              # не приняла команду, следующий пересчёт повторит её — но слать
              # «зарядка началась» на каждом повторе всю ночь нельзя, такие
              # уведомления быстро перестают читать. Проверять здесь фактическое
              # состояние выключателя бесполезно: дешёвые станции подтверждают
              # включение с задержкой в несколько секунд, и уведомление
              # не пришло бы вовсе.
              - if:
                  - condition: template
                    value_template: "{{ first_turn_on_attempt }}"
                then:
                  - sequence: !input on_start_actions

          - if:
              - condition: template
                value_template: "{{ debug_logging }}"
            then:
              - action: logbook.log
                continue_on_error: true
                data:
                  name: "Зарядка EV"
                  message: >-
                    {{ verdict }} |
                    план={{ plan_source }}{{ ' МОРОЗ' if cold_mode else '' }} |
                    заряд={{ soc ~ '% (не менялся ' ~ soc_age_min ~ ' мин)'
                             if soc_valid
                             else ('н/д' if soc_problem == 'none'
                                   else 'н/д (' ~ soc_problem ~ ')') }} |
                    ёмкость {{ effective_capacity }} кВт·ч |
                    нужно {{ needed_kwh | round(2) }} кВт·ч
                    за {{ (hours_left | float(0) * 60) | round(0) }} мин |
                    U={{ voltage | round(0) }} В ({{ voltage_source }}) × {{ phases_n }} ф |
                    уставка {{ current_now }} → {{ desired_current }} А
                    (возраст {{ current_age }} с), по факту идёт
                    {{ actual_current if e_ampere != '' else 'н/д' }} А{{
                      ' (недодача ' ~ current_shortfall ~ ' А)'
                      if e_ampere != '' and current_shortfall | float(0) > 0.5
                      else '' }} |
                    статус={{ charger_status }} | машина заряжается: {{ car_says_charging }}
                  entity_id: "{{ e_switch }}"

      # ================= ВЕТКА 2: останавливаем =================
      - conditions:
          - condition: template
            value_template: "{{ must_stop }}"
        sequence:
          # выключение идёт первым и без задержки — это команда безопасности
          - action: switch.turn_off
            continue_on_error: true
            target:
              entity_id: "{{ e_switch }}"

          - if:
              - condition: template
                value_template: "{{ e_session != '' }}"
            then:
              - action: input_boolean.turn_off
                continue_on_error: true
                target:
                  entity_id: "{{ e_session }}"

          - if:
              - condition: template
                value_template: "{{ debug_logging }}"
            then:
              - action: logbook.log
                continue_on_error: true
                data:
                  name: "Зарядка EV"
                  message: >-
                    Стоп: {{ verdict }} ({{ stop_reason }}).
                    Заряд={{ soc if soc_valid else 'н/д' }}%
                    из {{ target_soc }}%,
                    отдано {{ energy_done if energy_valid else 'н/д' }} кВт·ч,
                    статус станции={{ charger_status }},
                    шло {{ actual_current if e_ampere != '' else 'н/д' }} А
                    при уставке {{ current_now }} А,
                    трекер={{ tracker_state }}{{ ' (дома)' if car_home else '' }},
                    сессия длилась {{ (switch_age | float(0) / 60) | round(0) }} мин
                  entity_id: "{{ e_switch }}"

          - sequence: !input on_finish_actions

          # Сброса уставки здесь нет намеренно. Он требует паузы (станция
          # не переварит две команды подряд), а блокирующая пауза в режиме
          # restart не доживает до конца: выключение, отправленное строкой
          # выше, само меняет статус станции — а это наш же триггер, который
          # обрывает последовательность вместе с невыполненной командой.
          # Поэтому сброс вынесен в ветку 3 и выполняется следующим прогоном,
          # так же как разнесены «уставка → включение» на старте.

    # ================= ВЕТКА 3: ничего не делаем =================
    # Самый частый исход и самый трудный для разбора: раньше пересчёт, не
    # приведший к команде, не оставлял следа вообще, и «почему ночью ничего
    # не произошло» приходилось выводить из косвенных признаков.
    default:
      # Уборка за прошлой сессией. Обе команды идут отдельным прогоном
      # и потому переживают обрыв, в отличие от прежней паузы в ветке 2.

      # Флаг сессии мог остаться поднятым, если зарядку выключили не мы.
      - if:
          - condition: template
            value_template: "{{ session_flag_stuck }}"
        then:
          - action: input_boolean.turn_off
            continue_on_error: true
            target:
              entity_id: "{{ e_session }}"

      # Сброс уставки к минимуму после остановки: следующая ручная зарядка
      # не должна стартовать с ночным током. Ждём паузу между командами,
      # чтобы станция успела переварить выключение.
      #
      # switch_off_confirmed и charger_online обязательны. Иначе обрыв связи,
      # при котором выключатель на секунду становится недоступным, читался бы
      # как остановка — и уставка живой зарядки сбрасывалась бы к минимуму
      # посреди ночи. Ток после такого не восстановится сам: зона
      # нечувствительности пропускает повышение, но следующий пересчёт придёт
      # только через интервал, а до тех пор машина будет заряжаться на шести
      # амперах.
      - if:
          - condition: template
            value_template: >-
              {{ reset_current_on_stop and switch_off_confirmed and charger_online
                 and switch_gap_elapsed and gap_elapsed
                 and current_now > num_min }}
        then:
          - action: number.set_value
            continue_on_error: true
            target:
              entity_id: "{{ e_current }}"
            data:
              value: "{{ num_min }}"

      - if:
          - condition: template
            value_template: "{{ debug_logging }}"
        then:
          - action: logbook.log
            continue_on_error: true
            data:
              name: "Зарядка EV"
              message: >-
                Без действий: {{ verdict }} |
                выключатель={{ 'вкл' if switch_on else 'выкл' }},
                статус={{ charger_status }},
                заряд={{ soc if soc_valid else 'н/д' }}%,
                уставка {{ current_now }} А
                {{ '(расчёт ' ~ desired_current ~ ' А)'
                   if desired_current != current_now else '' }}
              entity_id: "{{ e_switch }}"
