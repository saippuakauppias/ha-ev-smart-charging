---
name: Сообщить о проблеме
description: Что-то работает не так, как описано
labels: [bug]
body:
  - type: markdown
    attributes:
      value: >-
        ### Прежде чем заполнять


        Разобрать проблему без логов почти невозможно: автоматизация работает
        ночью, а решение принимается по десятку сенсоров сразу.


        **1. Включите параметр «Записывать ход зарядки в журнал»** — каждый
        пересчёт объяснит своё решение одной строкой. Журнал переживает
        перезагрузку и не вытесняется.


        **2. Поднимите лимит трассировок.** Home Assistant хранит всего
        **5 последних** трассировок на автоматизацию — это два с половиной часа
        при пересчёте раз в полчаса и меньше часа, если поставить десять минут.
        В любом случае к утру от ночной зарядки не остаётся ничего.
        Настройки → Автоматизации → ⋮ → «Изменить в YAML»:


        ```yaml

        trace:
          stored_traces: 100
        ```


        Подробности — в разделе
        [Диагностика](https://github.com/saippuakauppias/ha-ev-smart-charging#лимит-трассировок).


        Если проблема повторяется, дождитесь следующей ночи с включёнными
        логами — с ними разбор занимает минуты вместо переписки на неделю.

  - type: checkboxes
    id: diagnostics-enabled
    attributes:
      label: Диагностика
      options:
        - label: Логирование в журнал включено
        - label: "`stored_traces` поднят (или трассировка приложена ниже)"

  - type: textarea
    id: what-happened
    attributes:
      label: Что произошло
      description: >-
        Опишите ожидаемое и фактическое поведение. Если в журнале есть строка
        с вердиктом («вне окна зарядки», «кабель не подключён», «ток в норме…»)
        — приведите её: она называет причину решения прямо.
    validations:
      required: true

  - type: input
    id: ha-version
    attributes:
      label: Версия Home Assistant
      placeholder: "2026.7.1"
    validations:
      required: true

  - type: input
    id: blueprint-version
    attributes:
      label: Версия блюпринта
      description: Указана в конце описания блюпринта.
      placeholder: "1.3.0"
    validations:
      required: true

  - type: input
    id: charger
    attributes:
      label: Зарядная станция и способ подключения
      placeholder: "модель, интеграция"

  - type: dropdown
    id: plan-source
    attributes:
      label: По чему считается план
      description: >-
        Видно в журнале как `план=soc` / `план=energy` / `план=none`.
        От этого зависит половина логики, а «зарядка не управляется» чаще всего
        оказывается именно `none` — то есть данных о заряде нет.
      options:
        - "soc — по проценту заряда машины"
        - "energy — по счётчику энергии станции"
        - "none — данных нет, идёт резервный ток"
        - "не знаю"

  - type: checkboxes
    id: session-flag
    attributes:
      label: Флаг сессии
      description: >-
        Если он заполнен, автоматизация не вмешивается в зарядку, которую
        включили вручную. Незаполненный или залипший флаг — типовая причина
        обращений «блюпринт ничего не делает».
      options:
        - label: Вспомогательный флаг сессии настроен
        - label: Зарядка в этот раз включалась вручную

  - type: textarea
    id: logbook
    attributes:
      label: Записи журнала
      description: >-
        Строки за проблемный период, а не только момент сбоя: причина часто
        видна за пересчёт-другой до него. Это самая полезная информация.


        Через интерфейс «Активность» журнал не выгружается, но он лежит внутри
        трассировок. Скачайте их и запустите `python3 tools/trace_report.py
        ~/Downloads` — скрипт соберёт ленту по времени и покажет, какие команды
        реально ушли на станцию.
      render: text

  - type: textarea
    id: trace
    attributes:
      label: Трассировка автоматизации
      description: >-
        Настройки → Автоматизации → нужная автоматизация → Трассировки →
        Скачать. **Достаточно двух-трёх трассировок вокруг проблемного
        момента** — выгружать всю ночь не нужно. Если прикладываете текстом,
        хватит переменной `diag`: в ней собрано состояние всего пересчёта.
        Уберите координаты и токены перед публикацией.
