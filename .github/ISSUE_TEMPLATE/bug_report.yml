---
name: Сообщить о проблеме
description: Что-то работает не так, как описано
labels: [bug]
body:
  - type: markdown
    attributes:
      value: >-
        ### Прежде чем заполнять


        Разобрать проблему без логов почти невозможно: автоматизация работает
        ночью, а решение принимается по десятку сенсоров сразу.


        **1. Включите параметр «Записывать ход зарядки в журнал»** — каждый
        пересчёт объяснит своё решение одной строкой. Журнал переживает
        перезагрузку и не вытесняется.


        **2. Поднимите лимит трассировок.** Home Assistant хранит всего
        **5 последних** трассировок на автоматизацию — при пересчёте раз
        в 10 минут это меньше часа, и к утру от ночной зарядки не остаётся
        ничего. Настройки → Автоматизации → ⋮ → «Изменить в YAML»:


        ```yaml

        trace:
          stored_traces: 100
        ```


        Подробности — в разделе
        [Диагностика](https://github.com/saippuakauppias/ha-ev-smart-charging#лимит-трассировок).


        Если проблема повторяется, дождитесь следующей ночи с включёнными
        логами — с ними разбор занимает минуты вместо переписки на неделю.

  - type: checkboxes
    id: diagnostics-enabled
    attributes:
      label: Диагностика
      options:
        - label: Логирование в журнал включено
        - label: "`stored_traces` поднят (или трассировка приложена ниже)"

  - type: textarea
    id: what-happened
    attributes:
      label: Что произошло
      description: >-
        Опишите ожидаемое и фактическое поведение. Если в журнале есть строка
        с вердиктом («вне окна зарядки», «кабель не подключён», «ток в норме…»)
        — приведите её: она называет причину решения прямо.
    validations:
      required: true

  - type: input
    id: ha-version
    attributes:
      label: Версия Home Assistant
      placeholder: "2026.7.1"
    validations:
      required: true

  - type: input
    id: blueprint-version
    attributes:
      label: Версия блюпринта
      description: Указана в конце описания блюпринта.
      placeholder: "1.0.0"
    validations:
      required: true

  - type: input
    id: charger
    attributes:
      label: Зарядная станция и способ подключения
      placeholder: "модель, интеграция"

  - type: textarea
    id: logbook
    attributes:
      label: Записи журнала
      description: >-
        Строки за проблемную ночь целиком, а не только момент сбоя: причина
        часто видна за пересчёт-другой до него. Это самая полезная информация.
      render: text

  - type: textarea
    id: trace
    attributes:
      label: Трассировка автоматизации
      description: >-
        Настройки → Автоматизации → нужная автоматизация → Трассировки →
        Скачать. Достаточно приложить переменную `diag` — в ней собрано
        состояние всего пересчёта. Уберите координаты и токены
        перед публикацией.
